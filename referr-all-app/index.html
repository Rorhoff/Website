<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Referr-All</title>
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon.svg" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Referr-All" />
    <meta property="og:image" content="https://rorhoff.com/referr-all/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://rorhoff.com/referr-all/favicon.svg" />
    <style>
      /* Portfolio cross-links (rorhoff.com dev). Hidden on referr-all.com prod via
         data-service-mode="referrall" injected by main.py. */
      .site-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem 1.25rem;
        padding: 0.75rem 1.5rem;
        border-bottom: 1px solid #d1dae6;
        background: #ffffff;
        align-items: center;
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        line-height: 1.6;
        position: sticky;
        top: 0;
        z-index: 60;
      }
      html[data-service-mode="referrall"] .site-nav { display: none; }
      .site-nav a {
        color: #64748b;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        border-bottom: 2px solid transparent;
        padding-bottom: 0.1rem;
      }
      .site-nav a:hover { color: #ea580c; }
      .site-nav a.active {
        color: #0f172a;
        border-bottom-color: #ea580c;
      }
      .nav-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem 1.25rem;
        align-items: center;
      }
      .nav-hamburger {
        display: none;
        background: none;
        border: none;
        color: #1e293b;
        font-size: 1.4rem;
        line-height: 1;
        cursor: pointer;
        padding: 0.2rem 0.4rem;
        margin-left: auto;
      }
      @media (max-width: 640px) {
        .site-nav { flex-wrap: wrap; position: relative; }
        .nav-hamburger { display: block; }
        .nav-links {
          display: none;
          flex-direction: column;
          width: 100%;
          gap: 0;
          background: #ffffff;
          border-top: 1px solid #d1dae6;
          padding: 0.5rem 0;
        }
        .nav-links.open { display: flex; }
        .nav-links a {
          padding: 0.6rem 1rem;
          border-bottom: 1px solid #d1dae6;
          font-size: 0.95rem;
        }
        .nav-links a:last-child { border-bottom: none; }
      }
    </style>
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <button class="nav-hamburger" id="navHamburger" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <div class="nav-links" id="navLinks">
        <a href="../index.html">About</a>
        <a href="https://www.linkedin.com/in/rorhoff" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="../api-testing/">API Testing</a>
        <a href="../classifieds/">Classifieds</a>
        <a href="../airevolution/">AI Revolution</a>
        <a href="../referr-all/" class="active">Referr-All</a>
        <a href="../in-the-wild/">In the Wild</a>
        <a href="../sss/">SSS</a>
      </div>
    </nav>
    <div id="root"></div>
    <script>
      (function () {
        var btn = document.getElementById("navHamburger");
        var links = document.getElementById("navLinks");
        if (!btn || !links) return;
        btn.addEventListener("click", function () {
          var open = links.classList.toggle("open");
          btn.setAttribute("aria-expanded", open);
          btn.textContent = open ? "✕" : "☰";
        });
        document.addEventListener("click", function (e) {
          if (!links.contains(e.target) && e.target !== btn) {
            links.classList.remove("open");
            btn.setAttribute("aria-expanded", "false");
            btn.textContent = "☰";
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

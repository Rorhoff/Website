# nginx vhost for DEV (rorhoff.com)  ->  127.0.0.1:8000
# Install to: /etc/nginx/sites-available/rorhoff.conf
# Enable:     sudo ln -s /etc/nginx/sites-available/rorhoff.conf /etc/nginx/sites-enabled/
# Reload:     sudo nginx -t && sudo systemctl reload nginx
#
# Assumes Let's Encrypt certs already at /etc/letsencrypt/live/rorhoff.com/.
# If you currently have a single vhost that handles rorhoff.com, replace it with this one.

server {
    listen 80;
    listen [::]:80;
    server_name rorhoff.com www.rorhoff.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rorhoff.com www.rorhoff.com;

    ssl_certificate     /etc/letsencrypt/live/rorhoff.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rorhoff.com/privkey.pem;

    # Large image uploads: keep modest for dev so a runaway client can't fill RDS during testing.
    client_max_body_size 12M;

    # Long timeouts only on the slow endpoint; everything else uses defaults.
    location /api/slow {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 30s;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

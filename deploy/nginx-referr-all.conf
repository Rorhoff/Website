# nginx vhost for PROD (referr-all.com)  ->  127.0.0.1:8002
# Install to: /etc/nginx/sites-available/referr-all.conf
# Enable:     sudo ln -s /etc/nginx/sites-available/referr-all.conf /etc/nginx/sites-enabled/
# Reload:     sudo nginx -t && sudo systemctl reload nginx
#
# TLS: a Cloudflare Origin Certificate (15-year, free in the CF dashboard) installed at
# /etc/ssl/cloudflare/referr-all.com.{pem,key}. In Cloudflare -> SSL/TLS -> Overview, set
# the mode to "Full (strict)". Cloudflare proxies the public traffic and should be the only
# party that hits this port on EC2 -- restrict the EC2 security group to Cloudflare's
# published IP ranges (https://www.cloudflare.com/ips/) once verified.
#
# To create the Origin cert (one-time):
#   Cloudflare dashboard -> referr-all.com -> SSL/TLS -> Origin Server -> Create Certificate
#   Hostnames: referr-all.com, *.referr-all.com   (RSA, 15 years)
#   Save the certificate body to   /etc/ssl/cloudflare/referr-all.com.pem
#   Save the private key to        /etc/ssl/cloudflare/referr-all.com.key
#   sudo chmod 600 /etc/ssl/cloudflare/referr-all.com.key

server {
    listen 80;
    listen [::]:80;
    server_name referr-all.com www.referr-all.com;
    # Always canonicalize to apex (non-www) before HTTPS.
    return 301 https://referr-all.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name referr-all.com www.referr-all.com;

    ssl_certificate     /etc/ssl/cloudflare/referr-all.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/referr-all.com.key;

    # www -> apex so Search Console does not split authority across two hosts.
    if ($host = www.referr-all.com) {
        return 301 https://referr-all.com$request_uri;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Avatar/resume uploads: 8 MiB per file in the app, allow headroom for the multipart envelope.
    client_max_body_size 12M;

    # Trust the X-Forwarded-* set by Cloudflare's edge. Restore the real client IP for logs/limits.
    real_ip_header CF-Connecting-IP;
    # Add 'set_real_ip_from <cf-range>;' lines from https://www.cloudflare.com/ips/ to harden.

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health probe for uptime monitors / Cloudflare load balancer (no auth, set in main.py).
    location = /health {
        proxy_pass http://127.0.0.1:8002/health;
        access_log off;
    }
}

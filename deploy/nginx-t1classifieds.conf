# nginx vhost for PROD (t1classifieds.com)  ->  127.0.0.1:8001
# Install to: /etc/nginx/sites-available/t1classifieds.conf
# Enable:     sudo ln -s /etc/nginx/sites-available/t1classifieds.conf /etc/nginx/sites-enabled/
# Reload:     sudo nginx -t && sudo systemctl reload nginx
#
# TLS: a Cloudflare Origin Certificate (15-year, free in the CF dashboard) installed at
# /etc/ssl/cloudflare/t1classifieds.com.{pem,key}. In Cloudflare → SSL/TLS → Overview, set
# the mode to "Full (strict)". Cloudflare proxies the public traffic and is the only
# party that should hit this port on EC2 — restrict the EC2 security group to
# Cloudflare's published IP ranges (https://www.cloudflare.com/ips/) once verified.

server {
    listen 80;
    listen [::]:80;
    server_name t1classifieds.com www.t1classifieds.com;
    # Always canonicalize to apex (non-www) before HTTPS.
    return 301 https://t1classifieds.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name t1classifieds.com www.t1classifieds.com;

    ssl_certificate     /etc/ssl/cloudflare/t1classifieds.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/t1classifieds.com.key;

    # www → apex so Search Console does not split authority across two hosts.
    if ($host = www.t1classifieds.com) {
        return 301 https://t1classifieds.com$request_uri;
    }

    # Cloudflare → Origin → uses these. Hardening optional but recommended.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Image uploads: 8 MiB per file in the app, allow some headroom for the multipart envelope.
    client_max_body_size 12M;

    # Trust the X-Forwarded-* set by Cloudflare's edge. Restore the real client IP for logs/limits.
    real_ip_header CF-Connecting-IP;
    # Add 'set_real_ip_from <cf-range>;' lines from https://www.cloudflare.com/ips/ to harden.

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health probe for uptime monitors / Cloudflare load balancer (no auth, set in main.py).
    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        access_log off;
    }
}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSS — Multi-Player Test Harness</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #080c14;
      --surface: #0f1623;
      --border:  #1e2d45;
      --accent:  #38bdf8;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --danger:  #ef4444;
      --gold:    #f59e0b;
      --green:   #22c55e;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: .75rem 1rem 2rem; min-height: 100vh;
    }

    /* ── Nav ── */
    .site-nav { display: flex; gap: 1.25rem; margin-bottom: .75rem; font-size: .85rem; }
    .site-nav a { color: var(--muted); text-decoration: none; }
    .site-nav a.active { color: var(--accent); font-weight: 600; }
    .site-nav a:hover { color: var(--text); }

    h1 { color: var(--accent); font-size: 1.05rem; font-weight: 700;
         letter-spacing: .04em; margin-bottom: .65rem; }

    /* ── Top bar ── */
    .top-bar {
      display: flex; align-items: center; gap: .5rem;
      flex-wrap: wrap; margin-bottom: .75rem;
    }
    .pill {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; padding: .28rem .65rem; font-size: .8rem;
    }
    .pill-label { color: var(--muted); margin-right: .25rem; }
    .pill-val   { color: var(--accent); font-weight: 700; }

    /* ── Buttons ── */
    button {
      border: none; border-radius: 6px; padding: .38rem .85rem;
      font-size: .82rem; font-weight: 700; cursor: pointer;
      transition: filter .15s;
    }
    button:hover:not(:disabled) { filter: brightness(1.15); }
    button:disabled { opacity: .35; cursor: default; }
    .btn-3p  { background: #7c3aed; color: #fff; }
    .btn-4p  { background: var(--accent); color: #0a0f18; }
    .btn-rst { background: var(--danger); color: #fff; }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-sm { font-size: .73rem; padding: .25rem .5rem; }
    .btn-action { background: #1e3a5a; color: var(--accent); border: 1px solid #2a4f78; }
    .btn-start  { background: var(--green); color: #071a0f; }
    .btn-end    { background: #1a1a2e; color: #a78bfa; border: 1px solid #3730a3; }

    /* ── Turn order strip ── */
    .turn-strip {
      display: flex; align-items: center; gap: .4rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: .4rem .75rem;
      margin-bottom: .65rem; flex-wrap: wrap;
    }
    .turn-strip-label { font-size: .68rem; color: var(--muted);
                        text-transform: uppercase; letter-spacing: .05em;
                        font-weight: 600; margin-right: .25rem; }
    .turn-chip {
      display: flex; align-items: center; gap: .3rem;
      background: #0a0f18; border: 1px solid var(--border);
      border-radius: 5px; padding: .2rem .5rem; font-size: .78rem;
      transition: all .2s;
    }
    .turn-chip.active {
      border-color: var(--gold); color: var(--gold);
      background: #1a1200; font-weight: 700;
      box-shadow: 0 0 8px #f59e0b44;
    }
    .turn-chip .race-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .turn-arrow { color: var(--muted); font-size: .7rem; }

    /* ── Panel grid ── */
    .panel-grid {
      display: grid;
      gap: .65rem;
    }
    .panel-grid.g3 { grid-template-columns: repeat(3, 1fr); }
    .panel-grid.g4 { grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 800px) {
      .panel-grid.g3, .panel-grid.g4 { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 500px) {
      .panel-grid.g3, .panel-grid.g4 { grid-template-columns: 1fr; }
    }

    /* ── Panel ── */
    .panel {
      background: var(--surface);
      border: 2px solid var(--border);
      border-top: 3px solid var(--border);
      border-radius: 10px; padding: .65rem;
      display: flex; flex-direction: column; gap: .45rem;
      transition: border-color .25s, box-shadow .25s;
    }
    .panel.connected  { border-top-color: #22c55e44; }
    .panel.myturn {
      border-color: var(--gold);
      box-shadow: 0 0 14px #f59e0b33;
    }

    /* ── Panel header ── */
    .panel-hdr {
      display: flex; align-items: center; gap: .45rem;
      padding-bottom: .4rem;
      border-bottom: 1px solid var(--border);
    }
    .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
      transition: background .2s;
    }
    .conn-dot.on  { background: var(--green); box-shadow: 0 0 6px #22c55e88; }
    .conn-dot.err { background: var(--danger); }
    .panel-name { font-weight: 700; font-size: .95rem; flex: 1; }
    .role-badge {
      font-size: .65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; border-radius: 4px;
      padding: .1rem .38rem; background: #1e2d45; color: var(--muted);
    }
    .role-badge.host   { background: #2a1d00; color: var(--gold); border: 1px solid #6b4500; }
    .role-badge.player { background: #0a2418; color: var(--green); border: 1px solid #155235; }
    .role-badge.turn   {
      background: #0a2418; color: var(--green);
      border: 1px solid var(--green);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* ── Race banner ── */
    .race-banner {
      display: flex; align-items: center; gap: .5rem;
      border-radius: 6px; padding: .3rem .55rem;
      font-size: .78rem; font-weight: 600;
      background: #0a0f18; border: 1px solid var(--border);
    }
    .race-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .race-name   { flex: 1; color: var(--text); }
    .race-vp     { color: var(--gold); font-size: .72rem; }

    /* ── Resources ── */
    .res-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: .3rem;
    }
    .res-block {
      border-radius: 6px; padding: .3rem .5rem;
      display: flex; align-items: center; justify-content: space-between;
      font-size: .8rem;
    }
    .res-block.food    { background: #0d2218; border: 1px solid #14532d; }
    .res-block.science { background: #0a1c2e; border: 1px solid #1e3a5a; }
    .res-block.tool    { background: #1c1400; border: 1px solid #451a00; }
    .res-block.money   { background: #1c1600; border: 1px solid #713f12; }
    .res-label { color: var(--muted); font-size: .65rem; text-transform: uppercase;
                 letter-spacing: .05em; font-weight: 600; }
    .res-val   { font-weight: 700; font-size: .95rem; }
    .res-block.food    .res-val { color: #4ade80; }
    .res-block.science .res-val { color: var(--accent); }
    .res-block.tool    .res-val { color: #fb923c; }
    .res-block.money   .res-val { color: #fbbf24; }
    .res-inc { font-size: .65rem; color: var(--muted); }
    .res-inc.pos { color: #4ade8099; }
    .res-inc.neg { color: #f8717199; }

    /* ── Log ── */
    .log-wrap { position: relative; }
    .log-label {
      font-size: .6rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: .05em; font-weight: 600; margin-bottom: .2rem;
    }
    .log {
      background: #050810; border: 1px solid var(--border); border-radius: 6px;
      padding: .35rem .45rem; font-size: .67rem; font-family: monospace;
      color: var(--muted); height: 90px; overflow-y: auto;
    }
    .log-line { margin-bottom: .08rem; line-height: 1.35; word-break: break-all; }
    .log-line.in  { color: #7dd3fc; }
    .log-line.out { color: #86efac; }
    .log-line.err { color: var(--danger); }

    /* ── Actions ── */
    .act-row { display: flex; flex-wrap: wrap; gap: .3rem; min-height: 1.8rem; }

    /* ── Raw send ── */
    .send-row { display: flex; gap: .3rem; }
    .send-inp {
      flex: 1; min-width: 0;
      background: #0a0f18; border: 1px solid var(--border); border-radius: 5px;
      color: var(--text); padding: .28rem .45rem; font-size: .68rem; font-family: monospace;
    }
    .send-inp:focus { outline: none; border-color: var(--accent); }
  </style>
</head>
<body>

  <nav class="site-nav">
    <a href="../index.html">About</a>
    <a href="./">SSS</a>
    <a href="multitest.html" class="active">SSS Test</a>
  </nav>

  <h1>SSS — Multi-Player Test Harness</h1>

  <div class="top-bar">
    <button class="btn-3p" id="btn-3p">&#9654; 3-Player Game</button>
    <button class="btn-4p" id="btn-4p">&#9654; 4-Player Game</button>
    <button class="btn-rst" id="btn-reset">&#9724; Reset</button>
    <div class="pill"><span class="pill-label">Code</span><span class="pill-val" id="info-code">—</span></div>
    <div class="pill"><span class="pill-label">Phase</span><span class="pill-val" id="info-phase">—</span></div>
    <div class="pill"><span class="pill-label">Round</span><span class="pill-val" id="info-round">—</span></div>
  </div>

  <div class="turn-strip" id="turn-strip" style="display:none"></div>
  <div class="panel-grid" id="panel-grid"></div>

  <script>
  "use strict";

  const NAMES = ["Alice", "Bob", "Carol", "Dave"];
  const RACES = ["vorrkai","nexari","luminae","thornveld","obsidian_pact","dust_runners"];
  const RACE_COLORS = {
    vorrkai:       "#e74c3c",
    nexari:        "#1a5fa8",
    luminae:       "#ff69b4",
    thornveld:     "#27ae60",
    obsidian_pact: "#9b59b6",
    dust_runners:  "#8B4513",
  };
  const RACE_LABELS = {
    vorrkai:       "Vorrkai",
    nexari:        "Nexari",
    luminae:       "Luminae",
    thornveld:     "Thornveld",
    obsidian_pact: "Obsidian Pact",
    dust_runners:  "Dust Runners",
  };
  const RES_KEYS = ["food","science","tool","money"];
  const WS_BASE  = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/sss/ws/`;

  let gameCode    = null;
  let playerCount = 4;
  let panels      = [];

  // ── Build panel DOM ──────────────────────────────────────────────────────

  function buildPanels(count) {
    playerCount = count;
    const grid = document.getElementById("panel-grid");
    grid.innerHTML = "";
    grid.className = `panel-grid g${count}`;
    panels = [];

    const strip = document.getElementById("turn-strip");
    strip.style.display = "none";
    strip.innerHTML     = "";

    for (let i = 0; i < count; i++) {
      const el = document.createElement("div");
      el.className = "panel";
      el.id = `panel-${i}`;
      el.innerHTML = `
        <div class="panel-hdr">
          <div class="conn-dot" id="dot-${i}"></div>
          <span class="panel-name" id="pname-${i}">${NAMES[i]}</span>
          <span class="role-badge" id="role-${i}">offline</span>
        </div>
        <div id="race-${i}" style="display:none" class="race-banner">
          <div class="race-swatch" id="race-swatch-${i}"></div>
          <span class="race-name"  id="race-name-${i}">—</span>
          <span class="race-vp"   id="race-vp-${i}"></span>
        </div>
        <div class="res-grid" id="res-${i}">
          ${RES_KEYS.map(k => `
          <div class="res-block ${k}">
            <span class="res-label">${k}</span>
            <div style="text-align:right">
              <div class="res-val"  id="res-${i}-${k}">—</div>
              <div class="res-inc" id="inc-${i}-${k}"></div>
            </div>
          </div>`).join("")}
        </div>
        <div class="log-wrap">
          <div class="log-label">Message log</div>
          <div class="log" id="log-${i}"></div>
        </div>
        <div class="act-row" id="act-${i}"></div>
        <div class="send-row">
          <input class="send-inp" type="text" id="send-${i}" placeholder='{"type":"end_turn"}'>
          <button class="btn-ghost btn-sm" onclick="sendRaw(${i})">Send</button>
        </div>`;
      grid.appendChild(el);

      panels.push({
        ws: null, name: NAMES[i], role: null,
        lastState: null, raceIdx: i,
        el,
        dotEl:   document.getElementById(`dot-${i}`),
        roleEl:  document.getElementById(`role-${i}`),
        raceEl:  document.getElementById(`race-${i}`),
        logEl:   document.getElementById(`log-${i}`),
        actEl:   document.getElementById(`act-${i}`),
        sendEl:  document.getElementById(`send-${i}`),
      });
    }
  }

  // ── Logging ──────────────────────────────────────────────────────────────

  function log(idx, dir, payload) {
    const el   = panels[idx].logEl;
    const line = document.createElement("div");
    line.className = `log-line ${dir}`;
    const text = typeof payload === "object" ? JSON.stringify(payload) : String(payload);
    const ts   = new Date().toLocaleTimeString("en-US", { hour12: false, hour:"2-digit", minute:"2-digit", second:"2-digit" });
    line.textContent = `${ts} [${dir}] ${text}`;
    el.appendChild(line);
    while (el.children.length > 80) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
  }

  // ── Send ─────────────────────────────────────────────────────────────────

  function send(idx, obj) {
    const p = panels[idx];
    if (!p.ws || p.ws.readyState !== WebSocket.OPEN) { log(idx, "err", "Not connected"); return; }
    log(idx, "out", obj);
    p.ws.send(JSON.stringify(obj));
  }

  function sendRaw(idx) {
    const inp = panels[idx].sendEl;
    try { send(idx, JSON.parse(inp.value)); inp.value = ""; }
    catch (e) { log(idx, "err", "Bad JSON: " + e.message); }
  }

  // ── Message handler ───────────────────────────────────────────────────────

  function handleMsg(idx, msg) {
    log(idx, "in", msg);
    const p = panels[idx];

    if (msg.type === "joined") {
      p.role = msg.role;
      p.roleEl.textContent = msg.role;
      p.roleEl.className   = `role-badge ${msg.role}`;
      p.dotEl.className    = "conn-dot on";
      p.el.classList.add("connected");

      if (msg.role === "host") {
        gameCode = msg.code;
        document.getElementById("info-code").textContent = msg.code;
        let delay = 200;
        for (let i = 1; i < playerCount; i++) {
          setTimeout(() => connectPlayer(i, msg.code), delay);
          delay += 200;
        }
      }
    }

    if (msg.type === "game_state") {
      p.lastState = msg;
      document.getElementById("info-phase").textContent = msg.phase  ?? "—";
      document.getElementById("info-round").textContent = msg.round  ?? "—";
      renderResources(idx, msg);
      renderRace(idx, msg);
      renderActions(idx, msg);
      renderTurnStrip(msg);

      // Panel border highlight
      for (let i = 0; i < panels.length; i++) {
        const isTurn = msg.current_turn === panels[i].name;
        panels[i].el.classList.toggle("myturn", isTurn);
      }
    }

    if (msg.type === "error") log(idx, "err", msg.msg ?? JSON.stringify(msg));
  }

  // ── Turn strip ───────────────────────────────────────────────────────────

  function renderTurnStrip(state) {
    const strip = document.getElementById("turn-strip");
    const order = state.turn_order ?? state.players?.map(p => p.name) ?? [];
    if (!order.length) return;
    strip.style.display = "flex";

    const allPlayers = state.players ?? [];
    strip.innerHTML = `<span class="turn-strip-label">Turn Order</span>`;
    order.forEach((name, i) => {
      const pl    = allPlayers.find(p => p.name === name);
      const color = pl?.race ? (RACE_COLORS[pl.race] ?? "#64748b") : "#64748b";
      const active = state.current_turn === name;
      const chip = document.createElement("div");
      chip.className = "turn-chip" + (active ? " active" : "");
      chip.innerHTML = `<div class="race-dot" style="background:${color}"></div>${name}`;
      strip.appendChild(chip);
      if (i < order.length - 1) {
        const arr = document.createElement("span");
        arr.className = "turn-arrow"; arr.textContent = "›";
        strip.appendChild(arr);
      }
    });
  }

  // ── Render race banner ────────────────────────────────────────────────────

  function renderRace(idx, state) {
    const p  = panels[idx];
    const me = (state.players ?? []).find(pl => pl.name === p.name);
    if (!me?.race) return;
    const color = RACE_COLORS[me.race] ?? "#64748b";
    p.raceEl.style.display = "flex";
    p.raceEl.style.borderColor = color + "66";
    document.getElementById(`race-swatch-${idx}`).style.background = color;
    document.getElementById(`race-name-${idx}`).textContent = RACE_LABELS[me.race] ?? me.race;
    const vp = me.vp ?? me.victory_points;
    const vpEl = document.getElementById(`race-vp-${idx}`);
    vpEl.textContent = vp != null ? `${vp} VP` : "";
    // Color the panel top border to match race
    p.el.style.borderTopColor = color;
  }

  // ── Render resources ──────────────────────────────────────────────────────

  function renderResources(idx, state) {
    const me = (state.players ?? []).find(pl => pl.name === panels[idx].name);
    if (!me) return;
    const res    = me.resources ?? {};
    const income = me.income    ?? {};
    RES_KEYS.forEach(k => {
      const valEl = document.getElementById(`res-${idx}-${k}`);
      const incEl = document.getElementById(`inc-${idx}-${k}`);
      if (valEl) valEl.textContent = res[k] ?? 0;
      if (incEl) {
        const n = income[k] ?? 0;
        incEl.textContent = n > 0 ? `+${n}/turn` : "";
        incEl.className   = `res-inc ${n > 0 ? "pos" : n < 0 ? "neg" : ""}`;
      }
    });
  }

  // ── Render action buttons ─────────────────────────────────────────────────

  function renderActions(idx, state) {
    const p      = panels[idx];
    const phase  = state.phase ?? "";
    const myTurn = state.current_turn === p.name;
    const btns   = [];

    if (phase === "lobby" && p.role === "host") {
      btns.push(mkBtn("▶ Start Game", "btn-start", () => send(idx, { type: "start_game" })));
    }

    if (phase === "race_pick") {
      const me = (state.players ?? []).find(pl => pl.name === p.name);
      if (!me?.race) {
        const race  = RACES[p.raceIdx % RACES.length];
        const color = RACE_COLORS[race] ?? "#64748b";
        const label = RACE_LABELS[race] ?? race;
        const pb = mkBtn(`Pick: ${label}`, "btn-action", () => {
          send(idx, { type: "pick_race", race });
          p.raceIdx = (p.raceIdx + 1) % RACES.length;
          setTimeout(() => renderActions(idx, p.lastState ?? state), 60);
        });
        pb.style.borderColor = color + "99";
        pb.style.color       = color;
        btns.push(pb);
        btns.push(mkBtn("Next ▶", "btn-ghost btn-sm", () => {
          p.raceIdx = (p.raceIdx + 1) % RACES.length;
          renderActions(idx, p.lastState ?? state);
        }));
      } else {
        const lbl = document.createElement("span");
        const color = RACE_COLORS[me.race] ?? "#64748b";
        lbl.style.cssText = `font-size:.78rem;color:${color};align-self:center;font-weight:700`;
        lbl.textContent = `✓ ${RACE_LABELS[me.race] ?? me.race}`;
        btns.push(lbl);
      }
    }

    if (myTurn && !["lobby","race_pick"].includes(phase)) {
      p.roleEl.textContent = "YOUR TURN";
      p.roleEl.className   = "role-badge turn";
      btns.push(mkBtn("End Turn", "btn-end btn-sm", () => send(idx, { type: "end_turn" })));
      btns.push(mkBtn("Roll Dice", "btn-action btn-sm", () => send(idx, { type: "roll_dice" })));
    } else if (!["lobby","race_pick"].includes(phase)) {
      p.roleEl.textContent = p.role ?? "player";
      p.roleEl.className   = `role-badge ${p.role ?? "player"}`;
    }

    p.actEl.innerHTML = "";
    btns.forEach(b => p.actEl.appendChild(b));
  }

  function mkBtn(label, cls, onClick) {
    const b = document.createElement("button");
    b.className = cls;
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }

  // ── Connect player ────────────────────────────────────────────────────────

  function connectPlayer(idx, code) {
    const p      = panels[idx];
    const isHost = idx === 0;
    if (p.ws) { try { p.ws.close(); } catch (_) {} p.ws = null; }
    p.dotEl.className    = "conn-dot";
    p.roleEl.textContent = "connecting…";
    p.roleEl.className   = "role-badge";

    p.ws = new WebSocket(WS_BASE + (isHost ? "NEW" : code));

    p.ws.onopen = () => {
      p.dotEl.className = "conn-dot on";
      send(idx, isHost
        ? { type: "host", name: p.name }
        : { type: "join", name: p.name, code });
    };

    p.ws.onmessage = e => {
      try { handleMsg(idx, JSON.parse(e.data)); } catch (_) {}
    };

    p.ws.onclose = () => {
      p.dotEl.className    = "conn-dot err";
      p.roleEl.textContent = "offline";
      p.roleEl.className   = "role-badge";
      p.el.classList.remove("connected","myturn");
      p.el.style.borderTopColor = "";
    };

    p.ws.onerror = () => {
      p.dotEl.className = "conn-dot err";
      log(idx, "err", "WebSocket error");
    };
  }

  // ── Controls ──────────────────────────────────────────────────────────────

  function resetAll() {
    panels.forEach(p => { try { p.ws?.close(); } catch (_) {} });
    panels = [];
    gameCode = null;
    document.getElementById("info-code").textContent  = "—";
    document.getElementById("info-phase").textContent = "—";
    document.getElementById("info-round").textContent = "—";
    document.getElementById("turn-strip").style.display = "none";
    document.getElementById("panel-grid").innerHTML = "";
  }

  function launch(count) {
    resetAll();
    buildPanels(count);
    connectPlayer(0, null);
  }

  document.getElementById("btn-3p").addEventListener("click", () => launch(3));
  document.getElementById("btn-4p").addEventListener("click", () => launch(4));
  document.getElementById("btn-reset").addEventListener("click", resetAll);

  // Empty grid on load — user picks 3 or 4
  buildPanels(4);
  </script>
</body>
</html>

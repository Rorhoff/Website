<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSS — 4-Player Test Harness</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #080c14;
      --surface: #0f1623;
      --border:  #1e2d45;
      --accent:  #38bdf8;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --danger:  #ef4444;
      --gold:    #f59e0b;
      --green:   #22c55e;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 1rem; min-height: 100vh;
    }
    h1 { color: var(--accent); font-size: 1.1rem; margin-bottom: .75rem; letter-spacing: .03em; }

    /* ── Top bar ── */
    .top-bar { display: flex; align-items: center; gap: .65rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .pill {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; padding: .3rem .75rem; font-size: .82rem;
    }
    .pill span { color: var(--accent); font-weight: 700; }

    /* ── Buttons ── */
    button {
      background: var(--accent); color: #0a0f18; border: none;
      border-radius: 6px; padding: .4rem .9rem; font-size: .82rem;
      font-weight: 700; cursor: pointer; transition: opacity .15s;
    }
    button:disabled { opacity: .35; cursor: default; }
    button.danger  { background: var(--danger); color: #fff; }
    button.ghost   { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    button.sm { font-size: .75rem; padding: .28rem .55rem; }

    /* ── Panel grid ── */
    .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    @media (max-width: 700px) { .panel-grid { grid-template-columns: 1fr; } }

    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: .75rem;
      display: flex; flex-direction: column; gap: .5rem;
    }
    .panel.active  { border-color: var(--green); }
    .panel.myturn  { border-color: var(--gold); }

    /* ── Panel header ── */
    .panel-hdr { display: flex; align-items: center; gap: .5rem; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.on  { background: var(--green); }
    .dot.err { background: var(--danger); }
    .panel-name { font-weight: 700; font-size: .95rem; flex: 1; }
    .role-badge {
      font-size: .68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; border-radius: 4px;
      padding: .12rem .4rem; background: #1e2d45; color: var(--muted);
    }
    .role-badge.host   { background: #3a2a00; color: var(--gold); }
    .role-badge.player { background: #0a2a1a; color: var(--green); }
    .role-badge.turn   { background: #0a2a1a; color: var(--green); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.55 } }

    /* ── Resources ── */
    .res-row { display: flex; gap: .4rem; flex-wrap: wrap; }
    .res-chip {
      background: #0a0f18; border-radius: 4px; padding: .15rem .45rem;
      font-size: .78rem; display: flex; gap: .25rem; align-items: center;
    }
    .res-key { color: var(--muted); text-transform: uppercase; font-size: .65rem; font-weight: 600; }
    .res-val { color: var(--text); font-weight: 700; }
    .res-chip.race .res-val { color: var(--accent); font-size: .7rem; }

    /* ── Log ── */
    .log {
      background: #050810; border: 1px solid var(--border); border-radius: 6px;
      padding: .4rem .5rem; font-size: .7rem; font-family: monospace;
      color: var(--muted); height: 110px; overflow-y: auto; flex-shrink: 0;
    }
    .log-line { margin-bottom: .1rem; }
    .log-line.in  { color: #7dd3fc; }
    .log-line.out { color: #86efac; }
    .log-line.err { color: var(--danger); }

    /* ── Actions ── */
    .act-row { display: flex; flex-wrap: wrap; gap: .3rem; min-height: 1.6rem; }

    /* ── Raw send ── */
    .send-row { display: flex; gap: .35rem; }
    .send-inp {
      flex: 1; min-width: 0;
      background: #0a0f18; border: 1px solid var(--border); border-radius: 5px;
      color: var(--text); padding: .3rem .5rem; font-size: .72rem; font-family: monospace;
    }
    .send-inp:focus { outline: none; border-color: var(--accent); }
  </style>
</head>
<body>
  <nav style="display:flex;gap:1rem;margin-bottom:.75rem;font-size:.85rem;">
    <a href="../index.html"     style="color:var(--muted);text-decoration:none">About</a>
    <a href="./"               style="color:var(--muted);text-decoration:none">SSS</a>
    <a href="multitest.html"   style="color:var(--accent);text-decoration:none;font-weight:600">SSS Test</a>
  </nav>
  <h1>SSS — 4-Player Test Harness</h1>

  <div class="top-bar">
    <button id="btn-launch">&#9654; Launch 4-Player Game</button>
    <button class="danger" id="btn-reset">Reset</button>
    <div class="pill">Code: <span id="info-code">—</span></div>
    <div class="pill">Phase: <span id="info-phase">—</span></div>
    <div class="pill">Turn: <span id="info-turn">—</span></div>
  </div>

  <div class="panel-grid" id="panel-grid"></div>

  <script>
  "use strict";

  const NAMES = ["Alice", "Bob", "Carol", "Dave"];
  const RACES = ["vorrkai","nexari","luminae","thornveld","obsidian_pact","dust_runners"];
  const WS_BASE = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/sss/ws/`;

  let gameCode = null;
  let panels   = [];

  // ── Build panel DOM ──────────────────────────────────────────────────────

  function buildPanels() {
    const grid = document.getElementById("panel-grid");
    grid.innerHTML = "";
    panels = [];

    for (let i = 0; i < 4; i++) {
      const el = document.createElement("div");
      el.className = "panel";
      el.id = `panel-${i}`;
      el.innerHTML = `
        <div class="panel-hdr">
          <div class="dot" id="dot-${i}"></div>
          <span class="panel-name">${NAMES[i]}</span>
          <span class="role-badge" id="role-${i}">offline</span>
        </div>
        <div class="res-row" id="res-${i}"><span style="color:var(--muted);font-size:.78rem">—</span></div>
        <div class="log" id="log-${i}"></div>
        <div class="act-row" id="act-${i}"></div>
        <div class="send-row">
          <input class="send-inp" type="text" id="send-${i}" placeholder='{"type":"end_turn"}'>
          <button class="ghost sm" onclick="sendRaw(${i})">Send</button>
        </div>`;
      grid.appendChild(el);

      panels.push({
        ws: null, name: NAMES[i], role: null,
        lastState: null, raceIdx: i,
        el,
        dotEl:  document.getElementById(`dot-${i}`),
        roleEl: document.getElementById(`role-${i}`),
        resEl:  document.getElementById(`res-${i}`),
        logEl:  document.getElementById(`log-${i}`),
        actEl:  document.getElementById(`act-${i}`),
        sendEl: document.getElementById(`send-${i}`),
      });
    }
  }

  // ── Log ──────────────────────────────────────────────────────────────────

  function log(idx, dir, payload) {
    const el   = panels[idx].logEl;
    const line = document.createElement("div");
    line.className = `log-line ${dir}`;
    const text = typeof payload === "object" ? JSON.stringify(payload) : String(payload);
    line.textContent = `[${dir}] ${text}`;
    el.appendChild(line);
    // Keep last 60 lines
    while (el.children.length > 60) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
  }

  // ── Send ─────────────────────────────────────────────────────────────────

  function send(idx, obj) {
    const p = panels[idx];
    if (!p.ws || p.ws.readyState !== WebSocket.OPEN) {
      log(idx, "err", "Not connected"); return;
    }
    log(idx, "out", obj);
    p.ws.send(JSON.stringify(obj));
  }

  function sendRaw(idx) {
    const inp = panels[idx].sendEl;
    try {
      send(idx, JSON.parse(inp.value));
      inp.value = "";
    } catch (e) {
      log(idx, "err", "Bad JSON: " + e.message);
    }
  }

  // ── Message handler ───────────────────────────────────────────────────────

  function handleMsg(idx, msg) {
    log(idx, "in", msg);
    const p = panels[idx];

    if (msg.type === "joined") {
      p.role = msg.role;
      p.roleEl.textContent = msg.role;
      p.roleEl.className   = `role-badge ${msg.role}`;
      p.dotEl.className    = "dot on";
      p.el.classList.add("active");

      if (msg.role === "host") {
        gameCode = msg.code;
        document.getElementById("info-code").textContent = msg.code;
        // Stagger joins so server processes them cleanly
        let delay = 200;
        for (let i = 1; i < 4; i++) {
          setTimeout(() => connectPlayer(i, msg.code), delay);
          delay += 200;
        }
      }
    }

    if (msg.type === "game_state") {
      p.lastState = msg;
      document.getElementById("info-phase").textContent = msg.phase  ?? "—";
      document.getElementById("info-turn").textContent  = msg.current_turn ?? "—";
      renderResources(idx, msg);
      renderActions(idx, msg);
      // Highlight whose turn it is
      for (let i = 0; i < 4; i++) {
        const isTurn = msg.current_turn === panels[i].name;
        panels[i].el.classList.toggle("myturn",  isTurn);
        panels[i].el.classList.toggle("active", !isTurn);
      }
    }

    if (msg.type === "error") {
      log(idx, "err", msg.msg ?? JSON.stringify(msg));
    }
  }

  // ── Render resources ──────────────────────────────────────────────────────

  function renderResources(idx, state) {
    const me = (state.players ?? []).find(p => p.name === panels[idx].name);
    if (!me) return;
    const r    = me.resources ?? {};
    const keys = ["food","science","tool","money"];
    let html   = keys.map(k =>
      `<div class="res-chip">
        <span class="res-key">${k[0]}</span>
        <span class="res-val">${r[k] ?? 0}</span>
      </div>`).join("");
    if (me.race) html += `<div class="res-chip race"><span class="res-key">race</span><span class="res-val">${me.race}</span></div>`;
    panels[idx].resEl.innerHTML = html;
  }

  // ── Render action buttons ─────────────────────────────────────────────────

  function renderActions(idx, state) {
    const p      = panels[idx];
    const phase  = state.phase ?? "";
    const myTurn = state.current_turn === p.name;
    const btns   = [];

    // Lobby: host can start
    if (phase === "lobby" && p.role === "host") {
      btns.push(mkBtn("Start Game", () => send(idx, { type: "start_game" })));
    }

    // Race pick: cycle through races
    if (phase === "race_pick") {
      const me = (state.players ?? []).find(pl => pl.name === p.name);
      if (!me?.race) {
        const race = RACES[p.raceIdx % RACES.length];
        const label = race.replace("_", " ");
        btns.push(mkBtn(`Pick: ${label}`, () => {
          send(idx, { type: "pick_race", race });
          p.raceIdx = (p.raceIdx + 1) % RACES.length;
          // Re-render immediately after click
          setTimeout(() => renderActions(idx, p.lastState ?? state), 50);
        }));
        btns.push(mkBtn("Next Race ▶", () => {
          p.raceIdx = (p.raceIdx + 1) % RACES.length;
          renderActions(idx, p.lastState ?? state);
        }));
      } else {
        const lbl = document.createElement("span");
        lbl.style.cssText = "font-size:.78rem;color:var(--green);align-self:center";
        lbl.textContent = `✓ ${me.race}`;
        btns.push(lbl);
      }
    }

    // My turn: end turn button + role badge update
    if (myTurn && !["lobby","race_pick"].includes(phase)) {
      p.roleEl.textContent = "YOUR TURN";
      p.roleEl.className   = "role-badge turn";
      btns.push(mkBtn("End Turn", () => send(idx, { type: "end_turn" })));
    } else if (!["lobby","race_pick"].includes(phase)) {
      p.roleEl.textContent = p.role ?? "player";
      p.roleEl.className   = `role-badge ${p.role ?? "player"}`;
    }

    p.actEl.innerHTML = "";
    btns.forEach(b => p.actEl.appendChild(b));
  }

  function mkBtn(label, onClick) {
    const b = document.createElement("button");
    b.className = "ghost sm";
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }

  // ── Connect player ────────────────────────────────────────────────────────

  function connectPlayer(idx, code) {
    const p      = panels[idx];
    const isHost = idx === 0;

    if (p.ws) { try { p.ws.close(); } catch (_) {} p.ws = null; }

    p.dotEl.className = "dot";
    p.roleEl.textContent = "connecting…";
    p.roleEl.className   = "role-badge";

    p.ws = new WebSocket(WS_BASE + (isHost ? "NEW" : code));

    p.ws.onopen = () => {
      p.dotEl.className = "dot on";
      if (isHost) {
        send(idx, { type: "host", name: p.name });
      } else {
        send(idx, { type: "join", name: p.name, code });
      }
    };

    p.ws.onmessage = e => {
      try { handleMsg(idx, JSON.parse(e.data)); } catch (_) {}
    };

    p.ws.onclose = () => {
      p.dotEl.className = "dot err";
      p.roleEl.textContent = "offline";
      p.roleEl.className   = "role-badge";
      p.el.classList.remove("active", "myturn");
    };

    p.ws.onerror = () => {
      p.dotEl.className = "dot err";
      log(idx, "err", "WebSocket error");
    };
  }

  // ── Top-bar controls ──────────────────────────────────────────────────────

  function resetAll() {
    panels.forEach(p => { try { p.ws?.close(); } catch (_) {} });
    buildPanels();
    gameCode = null;
    ["info-code","info-phase","info-turn"].forEach(id => {
      document.getElementById(id).textContent = "—";
    });
  }

  document.getElementById("btn-launch").addEventListener("click", () => {
    resetAll();
    connectPlayer(0, null);
  });

  document.getElementById("btn-reset").addEventListener("click", resetAll);

  // Init on load
  buildPanels();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSS — Multi-Player Test Harness</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #080c14;
      --surface: #0f1623;
      --border:  #1e2d45;
      --accent:  #38bdf8;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --danger:  #ef4444;
      --gold:    #f59e0b;
      --green:   #22c55e;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: .5rem .6rem 1.5rem; min-height: 100vh;
    }

    /* ── Nav ── */
    .site-nav { display: flex; gap: 1.25rem; margin-bottom: .75rem; font-size: .85rem; }
    .site-nav a { color: var(--muted); text-decoration: none; }
    .site-nav a.active { color: var(--accent); font-weight: 600; }
    .site-nav a:hover { color: var(--text); }
    h1 { color: var(--accent); font-size: 1.05rem; font-weight: 700;
         letter-spacing: .04em; margin-bottom: .65rem; }

    /* ── Top bar ── */
    .top-bar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .65rem; }
    .pill { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: .28rem .65rem; font-size: .8rem; }
    .pill-label { color: var(--muted); margin-right: .25rem; }
    .pill-val   { color: var(--accent); font-weight: 700; }

    /* ── Buttons ── */
    button { border: none; border-radius: 6px; padding: .38rem .85rem; font-size: .82rem; font-weight: 700; cursor: pointer; transition: filter .15s; }
    button:hover:not(:disabled) { filter: brightness(1.15); }
    button:disabled { opacity: .35; cursor: default; }
    .btn-3p  { background: #7c3aed; color: #fff; }
    .btn-4p  { background: var(--accent); color: #0a0f18; }
    .btn-5p  { background: #d97706; color: #fff; }
    .btn-6p  { background: #dc2626; color: #fff; }
    .btn-rst { background: var(--danger); color: #fff; }
    .btn-pause       { background: #374151; color: #e2e8f0; border: 1px solid #4b5563; }
    .btn-pause.paused { background: #064e3b; color: #6ee7b7; border-color: #059669; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-sm { font-size: .73rem; padding: .25rem .5rem; }
    .btn-action { background: #1e3a5a; color: var(--accent); border: 1px solid #2a4f78; }
    .btn-start  { background: var(--green); color: #071a0f; }
    .btn-end    { background: #1a1a2e; color: #a78bfa; border: 1px solid #3730a3; }
    .btn-step   { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .btn-step:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

    /* ── Phase progress stepper ── */
    .phase-stepper {
      display: none; align-items: center; gap: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: .45rem .85rem;
      margin-bottom: .6rem; overflow-x: auto;
    }
    .phase-stepper.visible { display: flex; }
    .step {
      display: flex; align-items: center; gap: .35rem;
      font-size: .72rem; font-weight: 600; color: var(--muted);
      white-space: nowrap; padding: 0 .2rem;
    }
    .step-circle {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--border); display: flex;
      align-items: center; justify-content: center;
      font-size: .6rem; font-weight: 800; flex-shrink: 0;
      transition: all .3s;
    }
    .step.done   .step-circle { background: var(--green);  border-color: var(--green);  color: #071a0f; }
    .step.active .step-circle { background: var(--gold);   border-color: var(--gold);   color: #0a0800; animation: stepPulse 1.2s ease-in-out infinite; }
    .step.done   { color: var(--green); }
    .step.active { color: var(--gold); }
    @keyframes stepPulse { 0%,100%{box-shadow:0 0 0 0 #f59e0b55} 50%{box-shadow:0 0 0 5px #f59e0b00} }
    .step-arrow { color: var(--border); font-size: .85rem; padding: 0 .15rem; }
    .step.done + .step-arrow  { color: var(--green); }
    .step.active + .step-arrow { color: var(--gold); }

    /* ── Auto-status bar ── */
    .auto-bar {
      display: none; align-items: center; gap: .6rem;
      background: #0a1a0a; border: 1px solid #1a3a1a;
      border-radius: 7px; padding: .35rem .75rem;
      margin-bottom: .6rem; font-size: .78rem; color: var(--green);
    }
    .auto-bar.visible { display: flex; }
    .auto-spinner {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid #22c55e44; border-top-color: var(--green);
      animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Turn strip ── */
    .turn-strip {
      display: none; align-items: center; gap: .4rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: .4rem .75rem;
      margin-bottom: .65rem; flex-wrap: wrap;
    }
    .turn-strip.visible { display: flex; }
    .turn-strip-label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-right: .25rem; }
    .turn-chip {
      display: flex; align-items: center; gap: .3rem;
      background: #0a0f18; border: 1px solid var(--border);
      border-radius: 5px; padding: .2rem .5rem; font-size: .78rem;
      transition: all .25s;
    }
    .turn-chip.active { border-color: var(--gold); color: var(--gold); background: #1a1200; font-weight: 700; box-shadow: 0 0 8px #f59e0b44; }
    .turn-chip .race-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .turn-arrow { color: var(--muted); font-size: .7rem; }

    /* ── Panel grid ── */
    .panel-grid { display: grid; gap: .4rem; }
    .panel-grid.g3 { grid-template-columns: repeat(3, 1fr); }
    .panel-grid.g4 { grid-template-columns: repeat(4, 1fr); }
    .panel-grid.g5 { grid-template-columns: repeat(3, 1fr); }
    .panel-grid.g6 { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 900px) { .panel-grid.g3, .panel-grid.g4, .panel-grid.g5, .panel-grid.g6 { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 500px) { .panel-grid.g3, .panel-grid.g4, .panel-grid.g5, .panel-grid.g6 { grid-template-columns: 1fr; } }

    /* ── Panel ── */
    .panel {
      background: var(--surface); border: 2px solid var(--border);
      border-top: 3px solid var(--border); border-radius: 8px; padding: .45rem;
      display: flex; flex-direction: column; gap: .3rem;
      transition: border-color .3s, box-shadow .3s; min-width: 0;
    }
    .panel.connected   { border-top-color: #22c55e55; }
    .panel.myturn      { border-color: var(--gold); box-shadow: 0 0 18px #f59e0b2a; }
    .panel.phase-flash { animation: flashPanel .5s ease-out; }
    @keyframes flashPanel { 0%{background:#1a2a0a} 100%{background:var(--surface)} }

    /* ── Panel header ── */
    .panel-hdr { display: flex; align-items: center; gap: .3rem; padding-bottom: .3rem; border-bottom: 1px solid var(--border); }
    .conn-dot  { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background .2s; }
    .conn-dot.on  { background: var(--green); box-shadow: 0 0 6px #22c55e88; }
    .conn-dot.err { background: var(--danger); }
    .conn-dot.wait { background: var(--gold); animation: pulse 1s infinite; }
    .panel-name { font-weight: 700; font-size: .85rem; flex: 1; }
    .role-badge { font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border-radius: 3px; padding: .08rem .3rem; background: #1e2d45; color: var(--muted); }
    .role-badge.host   { background: #2a1d00; color: var(--gold); border: 1px solid #6b4500; }
    .role-badge.player { background: #0a2418; color: var(--green); border: 1px solid #155235; }
    .role-badge.turn   { background: #0a2418; color: var(--green); border: 1px solid var(--green); animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* ── Race assignment preview ── */
    .race-assigned {
      display: flex; align-items: center; gap: .35rem;
      border-radius: 5px; padding: .2rem .4rem;
      font-size: .7rem; font-weight: 600;
      border: 1px solid #1e2d45; transition: all .4s;
    }
    .race-assigned.pending { opacity: .45; font-style: italic; }
    .race-assigned.locked  { opacity: 1; }
    .race-swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; transition: background .4s; }
    .race-label  { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .race-status { font-size: .6rem; color: var(--muted); white-space: nowrap; }
    .race-vp     { color: var(--gold); font-size: .65rem; white-space: nowrap; }

    /* ── Resources ── */
    .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .2rem; }
    .res-block { border-radius: 5px; padding: .2rem .35rem; display: flex; align-items: center; justify-content: space-between; font-size: .72rem; }
    .res-block.food    { background: #0d2218; border: 1px solid #14532d; }
    .res-block.science { background: #0a1c2e; border: 1px solid #1e3a5a; }
    .res-block.tool    { background: #1c1400; border: 1px solid #451a00; }
    .res-block.money   { background: #1c1600; border: 1px solid #713f12; }
    .res-label { color: var(--muted); font-size: .58rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
    .res-val   { font-weight: 700; font-size: .82rem; }
    .res-block.food    .res-val { color: #4ade80; }
    .res-block.science .res-val { color: var(--accent); }
    .res-block.tool    .res-val { color: #fb923c; }
    .res-block.money   .res-val { color: #fbbf24; }
    .res-inc { font-size: .56rem; }
    .res-inc.pos { color: #4ade8077; }
    .res-inc.neg { color: #f8717177; }

    /* ── Log ── */
    .log-label { font-size: .56rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-bottom: .15rem; }
    .log { background: #050810; border: 1px solid var(--border); border-radius: 5px; padding: .25rem .35rem; font-size: .6rem; font-family: monospace; color: var(--muted); height: 72px; overflow-y: auto; }
    .log-line { margin-bottom: .05rem; line-height: 1.3; word-break: break-all; }
    .log-line.in  { color: #7dd3fc; }
    .log-line.out { color: #86efac; }
    .log-line.step-highlight { background: rgba(251,191,36,.22); outline: 1px solid #f59e0b; border-radius: 2px; }
    .log-line.err { color: var(--danger); }
    .log-line.sys { color: var(--gold); }

    /* ── Actions ── */
    .act-row { display: flex; flex-wrap: wrap; gap: .25rem; min-height: 1.5rem; }

    /* ── Raw send ── */
    .send-row { display: flex; gap: .25rem; }
    .send-inp { flex: 1; min-width: 0; background: #0a0f18; border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: .2rem .35rem; font-size: .6rem; font-family: monospace; }
    .send-inp:focus { outline: none; border-color: var(--accent); }

    /* ── Mini board ── */
    .board-view { margin-bottom: .65rem; }
    .board-view.hidden { display: none; }
    .board-view-hdr { display: flex; align-items: center; gap: .6rem; margin-bottom: .3rem; }
    .board-view-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    .board-zoom-row { display: flex; align-items: center; gap: .35rem; margin-left: auto; }
    .board-zoom-label { font-size: .58rem; color: var(--muted); white-space: nowrap; }
    #board-zoom { width: 80px; accent-color: var(--accent); cursor: pointer; }
    #board-mini-svg { border: 1px solid var(--border); border-radius: 8px; background: #050810; display: block; }

    /* ── Hex hover tooltip ── */
    #hex-tooltip {
      position: fixed; pointer-events: none; display: none; z-index: 9999;
      background: #0a0f18; border: 1px solid var(--accent); border-radius: 7px;
      padding: .4rem .6rem; font-size: .7rem; font-family: monospace;
      color: var(--text); max-width: 220px; line-height: 1.45;
      box-shadow: 0 4px 16px #00000088;
    }
    #hex-tooltip .tt-type  { color: var(--accent); font-weight: 700; margin-bottom: .15rem; }
    #hex-tooltip .tt-planet{ color: #fbbf24; }
    #hex-tooltip .tt-piece { color: #86efac; }
    #hex-tooltip .tt-worm  { color: #a78bfa; }
    #hex-tooltip .tt-tri   { color: #fb923c; }

    /* ── Ship trail animation ── */
    @keyframes trailFade { from { opacity: 0.85 } to { opacity: 0 } }
  </style>
</head>
<body>

  <nav class="site-nav">
    <a href="../index.html">About</a>
    <a href="./">SSS</a>
    <a href="multitest.html" class="active">SSS Test</a>
  </nav>

  <h1>SSS — Multi-Player Test Harness</h1>

  <div class="top-bar">
    <button class="btn-3p" id="btn-3p">&#9654; 3-Player Game</button>
    <button class="btn-4p" id="btn-4p">&#9654; 4-Player Game</button>
    <button class="btn-5p" id="btn-5p">&#9654; 5-Player Game</button>
    <button class="btn-6p" id="btn-6p">&#9654; 6-Player Game</button>
    <button class="btn-rst" id="btn-reset">&#9724; Reset</button>
    <button class="btn-pause" id="btn-pause" disabled>&#9646;&#9646; Pause</button>
    <button class="btn-step" id="btn-step-back" disabled>⏮ Back</button>
    <button class="btn-step" id="btn-step-fwd"  disabled>Step &#9654;</button>
    <div class="pill"><span class="pill-label">Code</span><span class="pill-val" id="info-code">—</span></div>
    <div class="pill"><span class="pill-label">Phase</span><span class="pill-val" id="info-phase">—</span></div>
    <div class="pill"><span class="pill-label">Round</span><span class="pill-val" id="info-round">—</span></div>
  </div>

  <!-- Phase stepper -->
  <div class="phase-stepper" id="phase-stepper">
    <div class="step" id="step-connect"><div class="step-circle">1</div>Connect</div>
    <span class="step-arrow">›</span>
    <div class="step" id="step-lobby"><div class="step-circle">2</div>Lobby</div>
    <span class="step-arrow">›</span>
    <div class="step" id="step-race_pick"><div class="step-circle">3</div>Race Pick</div>
    <span class="step-arrow">›</span>
    <div class="step" id="step-dice_roll"><div class="step-circle">4</div>Dice Roll</div>
    <span class="step-arrow">›</span>
    <div class="step" id="step-place_pieces"><div class="step-circle">5</div>Place Pieces</div>
    <span class="step-arrow">›</span>
    <div class="step" id="step-draft"><div class="step-circle">6</div>Draft</div>
    <span class="step-arrow">›</span>
    <div class="step" id="step-playing"><div class="step-circle">7</div>Playing</div>
  </div>

  <!-- Auto-status -->
  <div class="auto-bar" id="auto-bar">
    <div class="auto-spinner"></div>
    <span id="auto-msg">Setting up…</span>
  </div>

  <!-- Turn strip -->
  <div class="turn-strip" id="turn-strip">
    <span class="turn-strip-label">Turn Order</span>
    <span id="turn-strip-inner"></span>
  </div>

  <div id="hex-tooltip"></div>

  <div class="panel-grid" id="panel-grid"></div>

  <!-- Mini board view -->
  <div class="board-view hidden" id="board-view">
    <div class="board-view-hdr">
      <span class="board-view-label">Board — pieces being placed</span>
      <div class="board-zoom-row">
        <span class="board-zoom-label">Size</span>
        <input type="range" id="board-zoom" min="300" max="1600" value="800" step="50">
        <span class="board-zoom-label" id="board-zoom-val">800</span>
      </div>
    </div>
    <svg id="board-mini-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <script>
  "use strict";

  const NAMES = ["Alice", "Bob", "Carol", "Dave", "Eve", "Frank"];
  const RACES = ["vorrkai","nexari","luminae","thornveld","obsidian_pact","dust_runners"];
  const RACE_COLORS = {
    vorrkai:       "#e74c3c",
    nexari:        "#1a8fe8",
    luminae:       "#e040fb",
    thornveld:     "#27ae60",
    obsidian_pact: "#9b59b6",
    dust_runners:  "#c0834a",
  };
  const RACE_LABELS = {
    vorrkai:       "Vorrkai",
    nexari:        "Nexari",
    luminae:       "Luminae",
    thornveld:     "Thornveld",
    obsidian_pact: "Obsidian Pact",
    dust_runners:  "Dust Runners",
  };
  const RES_KEYS = ["food","science","tool","money"];
  const PHASE_ORDER = ["connect","lobby","race_pick","dice_roll","place_pieces","draft","playing"];
  const WS_BASE = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/sss/ws/`;

  let gameCode         = null;
  let playerCount      = 4;
  let panels           = [];
  let assignedRaces    = [];   // pre-shuffled race per panel index
  let autoStarted       = false; // guard: don't send start_game twice
  let autoRacePicked    = [];    // guard per panel
  let autoRaceConfirmed = false; // guard: host confirm_race sent once
  let autoBeginAction   = false; // guard: host begin_action sent once
  let lastBoard         = null;  // most recent board from any message
  let autoPaused        = false; // pause all auto-play when true
  let stateHistory      = [];   // board snapshots for step-back/forward
  let historyIdx        = -1;   // current position in stateHistory (-1 = none)
  let _lastRoundLogged  = 0;    // track round changes for log banner
  let _prevBoard        = null; // board snapshot before last render (for trail animation)
  let _hexCoords        = {};   // hex id -> {cx, cy} in SVG space
  let _activeTrails     = [];   // {from, to, startedAt} — persist across renders
  const TRAIL_MS        = 4000; // trail linger duration in ms
  // ── Pace-estimation counters ──────────────────────────────────────────────
  let _statTurns      = 0;  // total end_turn messages sent across all players
  let _statInvasions  = 0;  // total invasions resolved
  let _statCombats    = 0;  // total ship combats resolved
  let _statFinalRound = 0;  // last round reached
  // (per-panel lastEndTurnSeq tracks last seq at which we sent end_turn)

  // ── Mini-board zoom slider ────────────────────────────────────────────────
  document.getElementById("board-zoom").addEventListener("input", function() {
    const v = parseInt(this.value, 10);
    const svgEl = document.getElementById("board-mini-svg");
    svgEl.setAttribute("width", v);
    const vb = svgEl.getAttribute("viewBox");
    if (vb) {
      const [,, vbW, vbH] = vb.split(" ").map(Number);
      svgEl.setAttribute("height", Math.round(v * vbH / vbW));
    }
    document.getElementById("board-zoom-val").textContent = v;
  });

  // ── Hex hover tooltip (event-delegated on SVG — survives innerHTML swaps) ─
  (function() {
    const tt  = document.getElementById("hex-tooltip");
    const svg = document.getElementById("board-mini-svg");
    const TYPE_NAMES = { orbital:"Orbital", bs_slot:"Build Slot", science:"Science", space:"Space",
      yellow:"Planet (Yellow)", blue:"Planet (Blue)", red:"Planet (Red)", white:"Planet (White)",
      green:"Planet (Green)", black_hole:"Black Hole" };
    svg.addEventListener("mousemove", e => {
      const hid = e.target?.dataset?.hid;
      if (hid == null) { tt.style.display = "none"; return; }
      const board = lastBoard;
      if (!board) return;
      const h = board[parseInt(hid, 10)];
      if (!h) return;
      let html = `<div class="tt-type">${TYPE_NAMES[h.type] ?? h.type}</div>`;
      html += `<div>Cluster <b>${h.cluster}</b> · Local ${h.local}`;
      if (h.label) html += ` · <b>${h.label}</b>`;
      html += `</div>`;
      if (h.tri) {
        const [tu, fu, su] = h.tri_counts ?? [];
        html += `<div class="tt-tri">⚙Upkeep ${tu} 🌿${fu} 🔬${su}${h.tri_farmer_green ? " (farmed)" : ""}</div>`;
      }
      if (h.wormhole && h.wormhole_partner != null)
        html += `<div class="tt-worm">⟷ Wormhole → hex ${h.wormhole_partner}</div>`;
      const planet = h.planet;
      if (planet) {
        html += `<div class="tt-planet">Planet — 🌿${planet.food} 🔬${planet.science} ⚙${planet.tool} $${planet.money} · ${planet.vp}VP</div>`;
      }
      const pieces = (h.pieces ?? []).filter(pc => pc.type !== "empire_flag");
      const flags  = (h.pieces ?? []).filter(pc => pc.type === "empire_flag");
      if (flags.length)  html += `<div class="tt-piece">🚩 ${flags.map(f=>f.owner).join(", ")}</div>`;
      pieces.forEach(pc => {
        html += `<div class="tt-piece">• ${pc.type}${pc.owner ? ` — ${pc.owner}` : ""}</div>`;
      });
      tt.innerHTML = html;
      tt.style.display = "block";
      tt.style.left = (e.clientX + 14) + "px";
      tt.style.top  = (e.clientY - 10) + "px";
    });
    svg.addEventListener("mouseleave", () => { tt.style.display = "none"; });
  })();

  // ── Shuffle helper ────────────────────────────────────────────────────────
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ── Build DOM ─────────────────────────────────────────────────────────────
  function buildPanels(count) {
    playerCount    = count;
    autoStarted       = false;
    autoRacePicked    = Array(count).fill(false);
    autoRaceConfirmed = false;
    autoBeginAction   = false;
    lastBoard         = null;
    assignedRaces  = shuffle(RACES).slice(0, count);

    const grid = document.getElementById("panel-grid");
    grid.innerHTML   = "";
    grid.className   = `panel-grid g${count}`;
    panels = [];

    document.getElementById("turn-strip").classList.remove("visible");
    document.getElementById("turn-strip-inner").innerHTML = "";
    document.getElementById("phase-stepper").classList.add("visible");
    document.getElementById("auto-bar").classList.remove("visible");
    setAutoMsg("");

    PHASE_ORDER.forEach(p => {
      const el = document.getElementById(`step-${p}`);
      if (el) el.className = "step";
    });
    advanceStep("connect");

    for (let i = 0; i < count; i++) {
      const race  = assignedRaces[i];
      const color = RACE_COLORS[race];
      const el = document.createElement("div");
      el.className = "panel";
      el.id = `panel-${i}`;
      el.innerHTML = `
        <div class="panel-hdr">
          <div class="conn-dot wait" id="dot-${i}"></div>
          <span class="panel-name">${NAMES[i]}</span>
          <span class="role-badge" id="role-${i}">connecting…</span>
        </div>
        <div class="race-assigned pending" id="race-${i}" style="border-color:${color}33;background:${color}0d">
          <div class="race-swatch" style="background:${color}88" id="race-swatch-${i}"></div>
          <span class="race-label" style="color:${color}99" id="race-lbl-${i}">${RACE_LABELS[race]}</span>
          <span class="race-status" id="race-status-${i}">assigned</span>
          <span class="race-vp" id="race-vp-${i}"></span>
        </div>
        <div class="res-grid" id="res-${i}">
          ${RES_KEYS.map(k => `
          <div class="res-block ${k}">
            <span class="res-label">${k}</span>
            <div style="text-align:right">
              <div class="res-val" id="res-${i}-${k}">—</div>
              <div class="res-inc" id="inc-${i}-${k}"></div>
            </div>
          </div>`).join("")}
        </div>
        <div>
          <div class="log-label">Message log</div>
          <div class="log" id="log-${i}"></div>
        </div>
        <div class="act-row" id="act-${i}"></div>
        <div class="send-row">
          <input class="send-inp" type="text" id="send-${i}" placeholder='{"type":"end_turn"}'>
          <button class="btn-ghost btn-sm" onclick="sendRaw(${i})">Send</button>
        </div>`;
      grid.appendChild(el);

      // Strategy: 0=builder, 1=ships, 2=conqueror, 3-5=aggressor
      const STRATEGIES = ["builder", "ships", "conqueror", "aggressor", "aggressor", "aggressor"];
      panels.push({
        ws: null, name: NAMES[i], role: null, lastState: null,
        autoRolled: false, lastDiceRound: null, lastDiceRoll: 0, lastEndTurnSeq: -1, lastActionsRemaining: -1,
        strategy: STRATEGIES[i] ?? "aggressor",
        el,
        dotEl:   document.getElementById(`dot-${i}`),
        roleEl:  document.getElementById(`role-${i}`),
        raceEl:  document.getElementById(`race-${i}`),
        logEl:   document.getElementById(`log-${i}`),
        actEl:   document.getElementById(`act-${i}`),
        sendEl:  document.getElementById(`send-${i}`),
      });
    }
  }

  // ── Phase stepper ─────────────────────────────────────────────────────────
  function advanceStep(phase) {
    // server uses "board"; stepper calls it "playing"
    const mapped = phase === "board" ? "playing" : phase;
    let found = false;
    PHASE_ORDER.forEach(p => {
      const el = document.getElementById(`step-${p}`);
      if (!el) return;
      if (found) { el.className = "step"; return; }
      if (p === mapped) { el.className = "step active"; found = true; }
      else              { el.className = "step done"; }
    });
  }

  // ── Auto-status bar ───────────────────────────────────────────────────────
  function setAutoMsg(msg) {
    const bar = document.getElementById("auto-bar");
    const txt = document.getElementById("auto-msg");
    if (msg) { bar.classList.add("visible"); txt.textContent = msg; }
    else      { bar.classList.remove("visible"); }
  }

  // ── Log ───────────────────────────────────────────────────────────────────
  function summarizeMsg(msg, dir) {
    if (typeof msg !== "object" || !msg) return String(msg);
    const t = msg.type ?? "?";
    if (dir === "out") {
      if (t === "end_turn")          return `→ end_turn`;
      if (t === "roll_dice")         return `→ roll_dice`;
      if (t === "start_invasion")    return `→ start_invasion${msg.tech_card ? ` (+${msg.tech_card})` : ""}`;
      if (t === "roll_combat_dice")  return `→ roll_combat_dice`;
      if (t === "flight_move")       return `→ flight_move`;
      if (t === "invasion_attack")   return `→ invasion_attack cl:${msg.cluster}`;
      if (t === "build_piece")       return `→ build ${msg.piece_type} h:${msg.hex_id}`;
      if (t === "research_skill")    return `→ research ${msg.column}`;
      if (t === "draw_tech_card")    return `→ draw_tech_card`;
      if (t === "host")              return `→ host name:${msg.name}`;
      if (t === "join")              return `→ join ${msg.code}`;
      if (t === "pick_race")         return `→ pick_race ${msg.race}`;
      return `→ ${t}`;
    }
    // incoming
    const R = msg.round ?? "?";
    if (t === "game_state")       return `[state] R${R} ${msg.current_turn ?? "?"}'s turn, ${msg.actions_remaining ?? "?"}act`;
    if (t === "invasion_prompt")  return `[invasion_prompt] cl:${msg.dest_cluster} atk:${msg.atk_count ?? 1}d def:${msg.def_dice_count ?? "?"}d`;
    if (t === "invasion_result")  return `[invasion_result] ATK ${msg.atk_total} vs PLT ${msg.planet_total} — ${msg.won ? "WON 🏆" : "LOST 💀"}`;
    if (t === "combat_prompt")    return `[combat_prompt] you atk ${msg.defender} cl:${msg.dest_cluster}`;
    if (t === "combat_defender_prompt") return `[combat_def] ${msg.attacker} attacks you cl:${msg.dest_cluster}`;
    if (t === "combat_result")    return `[combat] ATK ${msg.atk_total} vs DEF ${msg.def_total} → ${msg.winner} wins`;
    if (t === "joined")           return `[joined] as ${msg.role}${msg.code ? ` code:${msg.code}` : ""}`;
    if (t === "error")            return `[error] ${msg.msg ?? "?"}`;
    if (t === "eliminated")       return `[eliminated] ${msg.msg ?? ""}`;
    if (t === "bonus_tech_drawn") return `[tech] ${(msg.cards ?? []).map(c => c.name ?? c.id ?? c).join(", ")}`;
    if (t === "place_pieces_start") return `[place_pieces] your turn`;
    if (t === "draft_start")      return `[draft_start]`;
    if (t === "board_ready")      return `[board_ready] R${R}`;
    if (t === "dice_result")      return `[dice_result] ${JSON.stringify(msg.rolls ?? {})}`;
    return `[${t}]`;
  }

  function log(idx, dir, payload) {
    const el   = panels[idx].logEl;
    const line = document.createElement("div");
    line.className = `log-line ${dir}`;
    const ts   = new Date().toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});
    const summary = summarizeMsg(payload, dir);
    line.textContent = `${ts} ${summary}`;
    if (typeof payload === "object") line.title = JSON.stringify(payload);
    el.appendChild(line);
    while (el.children.length > 120) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
  }

  function sysLog(idx, msg) {
    const el   = panels[idx].logEl;
    const line = document.createElement("div");
    line.className = "log-line sys";
    line.textContent = `★ ${msg}`;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  // ── Send ──────────────────────────────────────────────────────────────────
  function send(idx, obj) {
    const p = panels[idx];
    if (!p.ws || p.ws.readyState !== WebSocket.OPEN) { log(idx,"err","Not connected"); return; }
    log(idx, "out", obj);
    if (obj.type === "end_turn") _statTurns++;
    p.ws.send(JSON.stringify(obj));
  }

  function sendRaw(idx) {
    const inp = panels[idx].sendEl;
    try { send(idx, JSON.parse(inp.value)); inp.value = ""; }
    catch (e) { log(idx, "err", "Bad JSON: " + e.message); }
  }

  // ── Auto piece placement ──────────────────────────────────────────────────
  function autoPlacePiece(idx, state) {
    const p           = panels[idx];
    const board       = state.board ?? lastBoard;
    if (!board) return;
    const turnOrder   = state.turn_order ?? [];
    const placementIdx = state.placement_idx ?? 0;
    if (placementIdx >= turnOrder.length) return;
    if (turnOrder[placementIdx] !== p.name) return; // not this player's turn to place

    const remaining  = (state.player_placement ?? {})[p.name] ?? [];
    if (!remaining.length) return;
    const nextPiece  = remaining[0];
    const myCluster  = (state.player_system ?? {})[p.name];
    const claimed    = new Set(Object.values(state.player_system ?? {}));

    let targetHex = null;

    if (nextPiece === "battle_station") {
      // Server requires: orbital type, cluster has a triangle tile, not black_hole, not claimed
      // 5-6P wheel map: also restrict to mid-clusters 13-18
      const triClusters = new Set(board.filter(h => h.tri).map(h => h.cluster));
      const is56p = playerCount >= 5;
      for (const h of board) {
        if (h.type !== "orbital") continue;
        if (!triClusters.has(h.cluster)) continue;
        if (board[h.cluster * 7]?.type === "black_hole") continue;
        if (claimed.has(h.cluster)) continue;
        if (is56p && (h.cluster < 13 || h.cluster > 18)) continue;
        targetHex = h; break;
      }
    } else if (nextPiece === "frigate") {
      if (myCluster != null) {
        for (const h of board) {
          if (h.cluster !== myCluster || h.type !== "orbital" || h.local === 0) continue;
          const cnt = (h.pieces ?? []).filter(pc => pc.type === "frigate").length;
          if (cnt < 3) { targetHex = h; break; }
        }
      }
    }

    if (targetHex != null) {
      sysLog(idx, `Auto-placing ${nextPiece} on hex ${targetHex.id}`);
      setTimeout(() => send(idx, { type: "place_piece", hex_id: targetHex.id }), 400);
    } else {
      sysLog(idx, `No valid hex found for ${nextPiece} — skipping`);
    }
  }

  // ── Auto-turn action sequence ─────────────────────────────────────────────
  // Strategies: builder(0) ships(1) conqueror(2) aggressor(3-5)
  function autoTurnAction(idx, state, force = false) {
    if (autoPaused && !force) return;
    const p        = panels[idx];
    const board    = state.board ?? lastBoard;
    if (!board) { send(idx, { type: "end_turn" }); return; }
    const me       = (state.players ?? []).find(pl => pl.name === p.name);
    const money    = (me?.resources ?? {}).money ?? 0;
    const tools    = (me?.resources ?? {}).tool  ?? 0;
    const strategy = p.strategy ?? "default";
    const BUILD_TYPES    = ["building_tool","building_science","building_money"];
    const SPACECRAFT_MAX = 3;
    const SHIP_TYPES     = ["frigate","cruise_ship","outpost","super_ship","battle_station","death_star"];

    // ── Common derived sets ───────────────────────────────────────────────────
    const myClusters = new Set();
    for (const h of board) {
      if (h.local === 0 && (h.pieces ?? []).some(pc => pc.type === "empire_flag" && pc.owner === p.name))
        myClusters.add(h.cluster);
    }
    const homeCluster = (state.player_system ?? {})[p.name];
    if (homeCluster != null) myClusters.add(homeCluster);

    const enemyClusters = new Set();
    for (const h of board) {
      if (h.local === 0 && (h.pieces ?? []).some(pc => pc.type === "empire_flag" && pc.owner !== p.name))
        enemyClusters.add(h.cluster);
    }

    const myFrigClusters = new Set();
    for (const h of board) {
      if ((h.pieces ?? []).some(pc => pc.type === "frigate" && pc.owner === p.name))
        myFrigClusters.add(h.cluster);
    }

    // ── Common helpers ────────────────────────────────────────────────────────
    function tryInvadeInSystem() {
      for (const cl of myFrigClusters) {
        if (myClusters.has(cl)) continue;
        const core = board.find(h => h.cluster === cl && h.local === 0);
        if (!core?.planet) continue;
        if (board.some(h => h.cluster === cl && (h.pieces ?? []).some(pc => pc.type === "frigate" && pc.owner !== p.name))) continue;
        sysLog(idx, `🌍 Invade cluster ${cl}`);
        send(idx, { type: "invasion_attack", cluster: cl });
        return true;
      }
      return false;
    }

    function buildingCost(btype) {
      const base = btype === "building_money" ? 6 : 4;
      const b = lastBoard ?? [];
      const planets = b.filter(h => h.local === 0 && h.planet &&
        (h.pieces ?? []).some(pc => pc.type === "empire_flag" && pc.owner === p.name)).length;
      return base * Math.max(1, planets);
    }

    function tryBuildFrigate() {
      if (money < 10 || tools < 2) return false;
      for (const cl of myClusters) {
        const h = board.find(o => o.cluster === cl && o.type === "orbital" && o.local !== 0
          && (o.pieces ?? []).filter(pc => SHIP_TYPES.includes(pc.type)).length < SPACECRAFT_MAX);
        if (h) {
          sysLog(idx, `🚀 Build frigate cluster ${cl} hex ${h.id} ($${money} ⚙${tools})`);
          send(idx, { type: "build_piece", piece_type: "frigate", hex_id: h.id });
          return true;
        }
      }
      return false;
    }

    function tryBuildBuilding() {
      const mCost = buildingCost("building_money");
      const tCost = buildingCost("building_tool");
      const btype = money >= mCost ? "building_money" : money >= tCost ? "building_tool" : null;
      if (!btype) return false;
      const minCost = btype === "building_money" ? mCost : tCost;
      for (const cl of myClusters) {
        const h = board.find(o => o.cluster === cl && o.type === "bs_slot" && o.local !== 0
          && (o.pieces ?? []).filter(pc => BUILD_TYPES.includes(pc.type)).length < 3);
        if (h) {
          sysLog(idx, `🏗 Build ${btype} hex ${h.id} ($${minCost})`);
          send(idx, { type: "build_piece", piece_type: btype, hex_id: h.id });
          return true;
        }
      }
      return false;
    }

    function tryFarmer() {
      if (tools < 3) return false;
      for (const cl of myClusters) {
        if (board.find(h => h.cluster === cl && h.tri && !h.tri_farmer_green)) {
          sysLog(idx, `🌿 Farmer upgrade (⚙${tools})`);
          send(idx, { type: "build_piece", piece_type: "farmer_upgrade" });
          return true;
        }
      }
      return false;
    }

    // ── Emergency: fix negative resources before anything else ────────────────
    function tryFixNegativeResource() {
      const res = me?.resources ?? {};
      const BUILD_COSTS = {
        building_science: buildingCost("building_science"),
        building_tool:    buildingCost("building_tool"),
        building_money:   buildingCost("building_money"),
      };
      // Priority order: whichever resource is most negative first
      const fixes = [
        ["science", "building_science"],
        ["tool",    "building_tool"],
        ["money",   "building_money"],
      ].filter(([key]) => (res[key] ?? 0) < 0);

      for (const [, btype] of fixes) {
        if (money < BUILD_COSTS[btype]) continue;
        for (const cl of myClusters) {
          const h = board.find(o => o.cluster === cl && o.type === "bs_slot" && o.local !== 0
            && (o.pieces ?? []).filter(pc => BUILD_TYPES.includes(pc.type)).length < 3);
          if (h) {
            sysLog(idx, `🚨 Fix negative ${btype.replace("building_","")} — build ${btype} h:${h.id}`);
            send(idx, { type: "build_piece", piece_type: btype, hex_id: h.id });
            return true;
          }
        }
      }
      // Fix negative food via farmer_upgrade (reduces tri food upkeep)
      if ((res.food ?? 0) < 0 && tools >= 3) {
        for (const cl of myClusters) {
          if (board.find(h => h.cluster === cl && h.tri && !h.tri_farmer_green)) {
            sysLog(idx, `🚨 Fix negative food — farmer_upgrade (⚙${tools})`);
            send(idx, { type: "build_piece", piece_type: "farmer_upgrade" });
            return true;
          }
        }
      }
      return false;
    }

    function buildRoutes() {
      const attack = [], expand = [];
      const seen = new Set();
      for (const h of board) {
        if (!h.wormhole || h.wormhole_partner == null || !myFrigClusters.has(h.cluster)) continue;
        // Require a frigate actually sitting on this wormhole hex (not just anywhere in cluster)
        if (!(h.pieces ?? []).some(pc => pc.type === "frigate" && pc.owner === p.name)) continue;
        const partner = board[h.wormhole_partner];
        if (!partner) continue;
        const dest = partner.cluster;
        const key = `${h.cluster}-${dest}`;
        if (seen.has(key)) continue;
        seen.add(key);
        const r = { from_wormhole: h.id, to_wormhole: h.wormhole_partner, from_cluster: h.cluster, dest_cluster: dest };
        const hasEnemy = board.some(dh => dh.cluster === dest && (dh.pieces ?? []).some(pc => pc.type === "frigate" && pc.owner !== p.name));
        if (hasEnemy) attack.push(r);
        else if (!myClusters.has(dest)) expand.push(r);
      }
      return { attack, expand };
    }

    function tryResearchSkill(column) {
      const science = (me?.resources ?? {}).science ?? 0;
      const levels  = ((me?.tech ?? {})[column]) ?? [false,false,false,false,false];
      const nextLvl = levels.findIndex(on => !on);
      if (nextLvl === -1) return false;
      const cost = [2, 3, 4, 5, 6][nextLvl] ?? 99;
      if (science < cost) return false;
      sysLog(idx, `🔬 Research ${column} Lv${nextLvl + 1} (${cost} sci)`);
      send(idx, { type: "research_skill", column });
      return true;
    }

    // ── BUILDER: buildings → draw tech → invade → expand ─────────────────────
    if (strategy === "builder") {
      if (tryFixNegativeResource()) return;
      if (tryBuildBuilding()) return;
      const techCount = (me?.tech_cards ?? []).length;
      if (techCount < 2) {
        sysLog(idx, `📜 Draw tech card (have ${techCount})`);
        send(idx, { type: "draw_tech_card" });
        return;
      }
      if (tryInvadeInSystem()) return;
      const { expand } = buildRoutes();
      if (expand.length > 0) {
        const r = expand[Math.floor(Math.random() * expand.length)];
        sysLog(idx, `✈ [builder] Expand to ${r.dest_cluster}`);
        send(idx, { type: "flight_move", from_wormhole: r.from_wormhole, to_wormhole: r.to_wormhole });
        return;
      }
      if (tryFarmer()) return;
      if (tryResearchSkill("engineering")) return;
      if (tryResearchSkill("biology")) return;
      sysLog(idx, `[builder] No action — end_turn ($${money})`);
      send(idx, { type: "end_turn" });
      return;
    }

    // ── SHIPS: build frigates → invade → expand ───────────────────────────────
    if (strategy === "ships") {
      if (tryFixNegativeResource()) return;
      if (tryBuildFrigate()) return;
      if (tryInvadeInSystem()) return;
      const { expand } = buildRoutes();
      if (expand.length > 0) {
        const r = expand[Math.floor(Math.random() * expand.length)];
        sysLog(idx, `✈ [ships] Expand to ${r.dest_cluster}`);
        send(idx, { type: "flight_move", from_wormhole: r.from_wormhole, to_wormhole: r.to_wormhole });
        return;
      }
      if (tryBuildBuilding()) return;
      if (tryFarmer()) return;
      if (tryResearchSkill("engineering")) return;
      if (tryResearchSkill("physics")) return;
      sysLog(idx, `[ships] No action — end_turn ($${money})`);
      send(idx, { type: "end_turn" });
      return;
    }

    // ── CONQUEROR: unclaimed planets first → expand to new systems ────────────
    if (strategy === "conqueror") {
      if (tryFixNegativeResource()) return;
      // Prefer unclaimed (no empire_flag) over enemy-owned
      const unclaimedFirst = [...myFrigClusters].filter(cl => {
        if (myClusters.has(cl)) return false;
        const core = board.find(h => h.cluster === cl && h.local === 0);
        if (!core?.planet) return false;
        if (board.some(h => h.cluster === cl && (h.pieces ?? []).some(pc => pc.type === "frigate" && pc.owner !== p.name))) return false;
        return !(core.pieces ?? []).some(pc => pc.type === "empire_flag");
      });
      for (const cl of unclaimedFirst) {
        sysLog(idx, `🌍 [conqueror] Claim unclaimed cluster ${cl}`);
        send(idx, { type: "invasion_attack", cluster: cl });
        return;
      }
      if (tryInvadeInSystem()) return;
      const { expand } = buildRoutes();
      const unclaimedExpand = expand.filter(r => {
        const core = board.find(h => h.cluster === r.dest_cluster && h.local === 0);
        return !(core?.pieces ?? []).some(pc => pc.type === "empire_flag");
      });
      const routes = unclaimedExpand.length > 0 ? unclaimedExpand : expand;
      if (routes.length > 0) {
        const r = routes[Math.floor(Math.random() * routes.length)];
        sysLog(idx, `✈ [conqueror] Expand to ${r.dest_cluster}`);
        send(idx, { type: "flight_move", from_wormhole: r.from_wormhole, to_wormhole: r.to_wormhole });
        return;
      }
      if (tryBuildFrigate()) return;
      if (tryBuildBuilding()) return;
      if (tryResearchSkill("government")) return;
      if (tryResearchSkill("physics")) return;
      sysLog(idx, `[conqueror] No action — end_turn ($${money})`);
      send(idx, { type: "end_turn" });
      return;
    }

    // ── AGGRESSOR: attack players 4-5 (last two in list), chase enemies ───────
    if (strategy === "aggressor") {
      if (tryFixNegativeResource()) return;
      const allPlayers = state.players ?? [];
      const targetNames = new Set(allPlayers.slice(-2).map(pl => pl.name));
      const { attack, expand } = buildRoutes();
      // Prefer routes toward targeted players
      const targetAttack = attack.filter(r =>
        board.some(h => h.cluster === r.dest_cluster && (h.pieces ?? []).some(pc => pc.type === "frigate" && targetNames.has(pc.owner)))
      );
      const chosenAttack = targetAttack.length > 0 ? targetAttack : attack;
      if (chosenAttack.length > 0) {
        const r = chosenAttack[Math.floor(Math.random() * chosenAttack.length)];
        sysLog(idx, `⚔ [aggressor] Attack cluster ${r.dest_cluster}`);
        send(idx, { type: "flight_move", from_wormhole: r.from_wormhole, to_wormhole: r.to_wormhole });
        return;
      }
      if (tryInvadeInSystem()) return;
      // Expand toward enemy territory
      const enemyFirst = expand.filter(r => enemyClusters.has(r.dest_cluster));
      const routes = enemyFirst.length > 0 ? enemyFirst : expand;
      if (routes.length > 0) {
        const r = routes[Math.floor(Math.random() * routes.length)];
        sysLog(idx, `✈ [aggressor] Move toward enemies ${r.dest_cluster}`);
        send(idx, { type: "flight_move", from_wormhole: r.from_wormhole, to_wormhole: r.to_wormhole });
        return;
      }
      if (tryBuildFrigate()) return;
      if (tryBuildBuilding()) return;
      if (tryResearchSkill("physics")) return;
      if (tryResearchSkill("government")) return;
      sysLog(idx, `[aggressor] No action — end_turn ($${money})`);
      send(idx, { type: "end_turn" });
      return;
    }

    // ── DEFAULT fallback ──────────────────────────────────────────────────────
    if (tryFixNegativeResource()) return;
    const { attack, expand } = buildRoutes();
    if (tryInvadeInSystem()) return;
    if (attack.length > 0) {
      const r = attack[Math.floor(Math.random() * attack.length)];
      sysLog(idx, `⚔ Move to cluster ${r.dest_cluster}`);
      send(idx, { type: "flight_move", from_wormhole: r.from_wormhole, to_wormhole: r.to_wormhole });
      return;
    }
    if (tryBuildFrigate()) return;
    if (expand.length > 0) {
      const r = expand[Math.floor(Math.random() * expand.length)];
      sysLog(idx, `✈ Expand to ${r.dest_cluster}`);
      send(idx, { type: "flight_move", from_wormhole: r.from_wormhole, to_wormhole: r.to_wormhole });
      return;
    }
    if (tryBuildBuilding()) return;
    if (tryFarmer()) return;
    sysLog(idx, `No action — end_turn ($${money} ⚙${tools})`);
    send(idx, { type: "end_turn" });
  }

  // ── Ship move detection for trail animation ───────────────────────────────
  function detectMiniMoves(newBoard) {
    if (!_prevBoard || !newBoard) return [];
    const MOVE_TYPES = ["frigate","cruise_ship","super_ship","death_star","battle_station"];
    const pos = (board) => {
      const m = {};
      for (const h of board) {
        for (const pc of (h.pieces ?? [])) {
          if (!MOVE_TYPES.includes(pc.type)) continue;
          const k = `${pc.owner ?? ""}:${pc.type}`;
          (m[k] = m[k] ?? []).push(h.id);
        }
      }
      return m;
    };
    const oldPos = pos(_prevBoard);
    const newPos = pos(newBoard);
    const moves = [];
    const allKeys = new Set([...Object.keys(oldPos), ...Object.keys(newPos)]);
    for (const k of allKeys) {
      const o = new Map();
      for (const id of (oldPos[k] ?? [])) o.set(id, (o.get(id) ?? 0) + 1);
      const n = new Map();
      for (const id of (newPos[k] ?? [])) n.set(id, (n.get(id) ?? 0) + 1);
      // Compute removals and additions
      const removed = [], added = [];
      for (const [id, cnt] of o) {
        const diff = cnt - (n.get(id) ?? 0);
        for (let i = 0; i < diff; i++) removed.push(id);
      }
      for (const [id, cnt] of n) {
        const diff = cnt - (o.get(id) ?? 0);
        for (let i = 0; i < diff; i++) added.push(id);
      }
      const count = Math.min(removed.length, added.length);
      for (let i = 0; i < count; i++) moves.push({ from: removed[i], to: added[i] });
    }
    return moves;
  }

  // ── Mini board renderer ───────────────────────────────────────────────────
  function renderMiniBoard(state) {
    const board = state.board ?? lastBoard;
    if (!board?.length) return;
    const moves = detectMiniMoves(board);
    const svgEl = document.getElementById("board-mini-svg");
    document.getElementById("board-view").classList.remove("hidden");

    const xs = board.map(h => h.x), ys = board.map(h => h.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const pad  = 28;
    const vw   = 800;
    const hexR = 25.2;
    const scale = (vw - pad * 2) / (maxX - minX + 2 * hexR || 1);
    const vh   = Math.round((maxY - minY + 2 * hexR) * scale + pad * 2);
    const tx   = x => (x - minX + hexR) * scale + pad;
    const ty   = y => (y - minY + hexR) * scale + pad;

    // rr proportional to scale — no cap so hexes always touch at any board size
    // Use flat-top vertices (0°, 60°, ...) to match server's flat-top ring offsets (30°, 90°, ...)
    const rr = Math.max(4, hexR * scale + 0.4);
    function hexPts(cx, cy) {
      return Array.from({length: 6}, (_, i) => {
        const a = (Math.PI / 3) * i;
        return `${(cx + rr * Math.cos(a)).toFixed(1)},${(cy + rr * Math.sin(a)).toFixed(1)}`;
      }).join(" ");
    }

    const clusterOwner = {};
    for (const [name, cl] of Object.entries(state.player_system ?? {})) clusterOwner[cl] = name;
    const playerColor = {};
    for (const pl of state.players ?? []) {
      if (pl.race) playerColor[pl.name] = RACE_COLORS[pl.race] ?? "#64748b";
    }

    const zoomW = parseInt(document.getElementById("board-zoom").value, 10);
    svgEl.setAttribute("viewBox", `0 0 ${vw} ${vh}`);
    svgEl.setAttribute("width",  zoomW);
    svgEl.setAttribute("height", Math.round(zoomW * vh / vw));

    // Ring hex type → subtle background tint
    const HEX_TINTS = {
      orbital:   "#0a1f35",
      bs_slot:   "#1a1000",
      science:   "#130a20",
      space:     "#050810",
    };
    // Center hex (planet) type → fill and stroke colors
    const PLANET_FILLS = {
      yellow:     "#1e1600", blue:  "#001020", white: "#10131a",
      red:        "#1e0800", green: "#001a08", black_hole: "#1a0030",
    };
    const PLANET_STROKES = {
      yellow:     "#9b7a14", blue:  "#1a65b0", white: "#606878",
      red:        "#952010", green: "#0a6830", black_hole: "#7000c0",
    };
    // Hex type → small label rendered inside hex
    const HEX_LABELS = { orbital: "O", bs_slot: "B", science: "S" };

    let inner = `<rect width="${vw}" height="${vh}" fill="#050810"/>`;

    // Wormhole connection lines
    const drawn = new Set();
    for (const h of board) {
      if (!h.wormhole || h.wormhole_partner == null) continue;
      const key = [Math.min(h.id, h.wormhole_partner), Math.max(h.id, h.wormhole_partner)].join("-");
      if (drawn.has(key)) continue;
      drawn.add(key);
      const p2 = board[h.wormhole_partner];
      inner += `<line x1="${tx(h.x).toFixed(1)}" y1="${ty(h.y).toFixed(1)}" x2="${tx(p2.x).toFixed(1)}" y2="${ty(p2.y).toFixed(1)}" stroke="#38bdf844" stroke-width="1" stroke-dasharray="3,3"/>`;
    }

    for (const h of board) {
      const cx = tx(h.x), cy = ty(h.y);
      _hexCoords[h.id] = { cx, cy };
      const owner    = clusterOwner[h.cluster];
      const ownColor = owner ? (playerColor[owner] ?? "#64748b") : null;
      const isCenter = h.local === 0;

      // Center hex: color by empire_flag owner (claimed/invaded) or planet type
      // Ring hex: type tint + subtle home-cluster ownership hint
      let fill, stroke, sw;
      if (isCenter) {
        const flag = (h.pieces ?? []).find(pc => pc.type === "empire_flag");
        const flagCol = flag ? (playerColor[flag.owner] ?? null) : null;
        if (flagCol) {
          fill = flagCol + "38"; stroke = flagCol + "ee"; sw = "2.5";
        } else {
          fill = PLANET_FILLS[h.type] ?? "#080c14";
          stroke = PLANET_STROKES[h.type] ?? "#1e2d45";
          sw = "1.5";
        }
      } else {
        fill = HEX_TINTS[h.type] ?? "#050810";
        stroke = "#1e2d45"; sw = "0.8";
        if (ownColor) { fill = ownColor + "10"; stroke = ownColor + "44"; sw = "0.9"; }
        if (h.tri)    { stroke = h.tri_color || "#f59e0b"; sw = "1.8"; }
      }
      let sciClick = "";
      if (!isCenter && h.type === "bs_slot" && ownColor) {
        stroke = "#9ec8e0"; sw = "1.6";
        sciClick = ` onclick="miniSciClick(${h.id})" style="cursor:pointer"`;
      }
      inner += `<polygon data-hid="${h.id}" points="${hexPts(cx, cy)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${sciClick}/>`;

      // Center hex: planet marker circle + system label
      if (isCenter) {
        const flag = (h.pieces ?? []).find(pc => pc.type === "empire_flag");
        const pCol = flag ? (playerColor[flag.owner] ?? PLANET_STROKES[h.type] ?? "#94a3b8")
                         : (PLANET_STROKES[h.type] ?? "#94a3b8");
        inner += `<circle cx="${cx}" cy="${cy}" r="${rr * 0.32}" fill="${pCol}55" stroke="${pCol}aa" stroke-width="1"/>`;
        if (h.label) {
          inner += `<text x="${cx}" y="${(cy - rr - 3).toFixed(1)}" text-anchor="middle" font-size="${Math.max(5.5, rr * 0.48)}" fill="${pCol}" font-family="system-ui" font-weight="700">${h.label}</text>`;
        }
      }

      // Ring hexes: type label (O / B / S)
      if (!isCenter && HEX_LABELS[h.type]) {
        inner += `<text x="${cx}" y="${(cy + rr * 0.35).toFixed(1)}" text-anchor="middle" font-size="${Math.max(4, rr * 0.38)}" fill="#ffffff22" font-family="monospace">${HEX_LABELS[h.type]}</text>`;
      }

      // Piece icons (skip empire_flag — ownership shown by center hex color)
      const pieces = (h.pieces ?? []).filter(pc => pc.type !== "empire_flag");
      if (pieces.length === 0) continue;

      // Use the primary piece owner's color (handles frigates from any player)
      const pieceOwner = pieces[0]?.owner;
      const col = (pieceOwner ? playerColor[pieceOwner] : null) ?? ownColor ?? "#64748b";
      // Count by type
      const frigates   = pieces.filter(pc => pc.type === "frigate").length;
      const bs         = pieces.filter(pc => pc.type === "battle_station").length;
      const buildings  = pieces.filter(pc => ["building_tool","building_science","building_money"].includes(pc.type)).length;

      // Frigate: solid upward-pointing triangle, one per frigate stacked horizontally
      if (frigates > 0) {
        const triW = rr * 0.32, triH = rr * 0.38;
        const step = triW * 1.6;
        const totalW = step * (frigates - 1);
        for (let fi = 0; fi < frigates; fi++) {
          const fx = cx - totalW / 2 + fi * step;
          const fy = cy;
          inner += `<polygon points="${fx},${fy - triH * 0.6} ${fx + triW * 0.6},${fy + triH * 0.4} ${fx - triW * 0.6},${fy + triH * 0.4}" fill="${col}" stroke="#fff" stroke-width="0.5"/>`;
        }
      }

      // Battle station: bold diamond
      if (bs > 0) {
        const d = rr * 0.42;
        inner += `<polygon points="${cx},${cy - d} ${cx + d * 0.65},${cy} ${cx},${cy + d} ${cx - d * 0.65},${cy}" fill="${col}" stroke="#fff" stroke-width="0.7"/>`;
      }


      // Building: small square
      if (buildings > 0) {
        const bs2 = rr * 0.2;
        inner += `<rect x="${cx - bs2}" y="${cy - bs2}" width="${bs2 * 2}" height="${bs2 * 2}" fill="${col}88" stroke="${col}" stroke-width="0.6"/>`;
        if (buildings > 1) inner += `<text x="${cx + bs2 + 1}" y="${cy + bs2 * 0.5}" font-size="${rr * 0.38}" fill="${col}" font-family="monospace">×${buildings}</text>`;
      }
    }

    // Register new moves into the persistent trail list
    const now = Date.now();
    for (const mv of moves) _activeTrails.push({ from: mv.from, to: mv.to, startedAt: now });
    // Expire old trails
    _activeTrails = _activeTrails.filter(t => now - t.startedAt < TRAIL_MS);

    svgEl.innerHTML = inner;

    // Re-draw all active trails after every render (innerHTML wipes them)
    const ns = "http://www.w3.org/2000/svg";
    for (const trail of _activeTrails) {
      const from = _hexCoords[trail.from], to = _hexCoords[trail.to];
      if (!from || !to) continue;
      const opacity = ((TRAIL_MS - (now - trail.startedAt)) / TRAIL_MS * 0.9).toFixed(2);
      const line = document.createElementNS(ns, "line");
      line.setAttribute("x1", from.cx.toFixed(1)); line.setAttribute("y1", from.cy.toFixed(1));
      line.setAttribute("x2", to.cx.toFixed(1));   line.setAttribute("y2", to.cy.toFixed(1));
      line.setAttribute("stroke", "#38bdf8");
      line.setAttribute("stroke-width", "2");
      line.setAttribute("stroke-dasharray", "5,3");
      line.setAttribute("opacity", opacity);
      svgEl.appendChild(line);
      const dot = document.createElementNS(ns, "circle");
      dot.setAttribute("cx", from.cx.toFixed(1)); dot.setAttribute("cy", from.cy.toFixed(1));
      dot.setAttribute("r", "4");
      dot.setAttribute("fill", "#38bdf8");
      dot.setAttribute("opacity", opacity);
      svgEl.appendChild(dot);
    }

    _prevBoard = JSON.parse(JSON.stringify(board));
  }

  // Click handler for science hexes in the mini-board
  function miniSciClick(hexId) {
    const board = lastBoard;
    if (!board) return;
    const hex = board[hexId];
    if (!hex) return;
    const cluster = hex.cluster;
    const BUILD_TYPES = ["building_tool","building_science","building_money"];
    for (let i = 0; i < panels.length; i++) {
      const state = panels[i].lastState;
      if (!state) continue;
      const sys = (state.player_system ?? {})[panels[i].name];
      if (sys !== cluster) continue;
      const existing = (hex.pieces ?? []).filter(pc => BUILD_TYPES.includes(pc.type)).length;
      if (existing >= 3) { sysLog(i, "Science hex is full"); return; }
      const me = (state.players ?? []).find(pl => pl.name === panels[i].name);
      const money = (me?.resources ?? {}).money ?? 0;
      const type = money >= 6 ? "building_science" : money >= 4 ? "building_tool" : null;
      if (!type) { sysLog(i, `Not enough money (${money}) to build`); return; }
      sysLog(i, `Manual build ${type} on hex ${hexId}`);
      send(i, { type: "build_piece", piece_type: type, hex_id: hexId });
      return;
    }
  }

  // ── Real-pace time estimation ─────────────────────────────────────────────
  // Assumptions: 2 min/turn deliberation, +1.5 min/invasion, +1 min/combat
  function estimateRealMinutes() {
    return Math.round(_statTurns * 2 + _statInvasions * 1.5 + _statCombats * 1);
  }

  function formatMinutes(total) {
    if (total < 60) return `${total} min`;
    const h = Math.floor(total / 60);
    const m = total % 60;
    return m > 0 ? `${h}h ${m}min` : `${h}h`;
  }

  // ── Shared state handler (game_state / place_pieces_start / draft_start) ──
  function handleState(idx, msg) {
    const p     = panels[idx];
    const phase = msg.phase ?? "";
    if (msg.board) lastBoard = msg.board;
    p.lastState = msg;

    // Record board snapshot from panel 0 only (avoids duplicates per broadcast)
    if (idx === 0 && lastBoard) {
      stateHistory.push({ state: { ...msg, board: lastBoard }, logLines: panels.map(p => p.logEl.lastElementChild ?? null) });
      if (stateHistory.length > 80) stateHistory.shift();
      historyIdx = stateHistory.length - 1;
      updateStepButtons();
    }

    document.getElementById("info-phase").textContent = phase;
    document.getElementById("info-round").textContent = msg.round ?? "—";
    renderResources(idx, msg);
    renderRace(idx, msg);
    renderActions(idx, msg);
    renderTurnStrip(msg);
    if (phase) advanceStep(phase);
    if (msg.board || lastBoard) renderMiniBoard(msg);

    // Combat result banner
    if (msg.type === "combat_result") {
      if (idx === 0) _statCombats++;
      if (p.name === msg.attacker || p.name === msg.defender) {
        const won = msg.winner === p.name;
        sysLog(idx, `${won ? "⚔ WON" : "🛡 LOST"} combat — ATK ${msg.atk_total} vs DEF ${msg.def_total} (winner: ${msg.winner})`);
      }
    }

    // Invasion result log
    if (msg.type === "invasion_result") {
      if (idx === 0) _statInvasions++;  // count once per event (panel 0 always receives broadcasts)
      if (msg.attacker === p.name) {
        sysLog(idx, `${msg.won ? "🏆 Invasion WON" : "💀 Invasion LOST"} — ATK ${msg.atk_total} vs PLT ${msg.planet_total}`);
      }
    }

    // Lobby: auto-start when all players present
    if (phase === "lobby") {
      const joined = (msg.players ?? []).length;
      if (joined === playerCount && !autoStarted && p.role === "host") {
        autoStarted = true;
        setAutoMsg(`All ${playerCount} players in lobby — starting game…`);
        setTimeout(() => { send(idx, { type: "start_game" }); setAutoMsg("Starting game…"); }, 700);
      }
    }

    // Race pick: auto-pick, then host confirms
    if (phase === "race_pick") {
      const me = (msg.players ?? []).find(pl => pl.name === p.name);
      if (!me?.race && !autoRacePicked[idx]) {
        autoRacePicked[idx] = true;
        const race = assignedRaces[idx];
        setAutoMsg("Auto-picking races…");
        setTimeout(() => { send(idx, { type: "pick_race", race }); sysLog(idx, `Auto-picked ${RACE_LABELS[race]}`); }, 300 + idx * 400);
      }
      const allPicked = (msg.players ?? []).every(pl => pl.race);
      if (allPicked && !autoRaceConfirmed && p.role === "host") {
        autoRaceConfirmed = true;
        setAutoMsg("All races locked — confirming…");
        setTimeout(() => send(idx, { type: "confirm_race" }), 300 + playerCount * 400 + 300);
      }
    }

    // Dice roll: auto-roll — one roll per player per round, guard via autoRolled
    if (phase === "dice_roll") {
      const me      = (msg.players ?? []).find(pl => pl.name === p.name);
      const drKey   = (msg.dice_round ?? []).join(",");
      const inRound = (msg.dice_round ?? []).includes(p.name);
      const myRoll  = me?.dice_roll ?? 0;

      // Reset when dice_round changes, OR when server zeroed our roll for a re-roll
      // (same pair can tie multiple times — key stays the same, but roll is cleared)
      if (drKey !== p.lastDiceRound
          || (p.autoRolled && inRound && myRoll === 0 && p.lastDiceRoll > 0)) {
        p.lastDiceRound = drKey;
        p.autoRolled    = false;
      }
      p.lastDiceRoll = myRoll;

      sysLog(idx, `dice_roll: inRound=${inRound} rolled=${myRoll} autoRolled=${p.autoRolled} round=[${drKey}]`);

      if (me && inRound && myRoll === 0 && !p.autoRolled) {
        p.autoRolled = true;
        setAutoMsg("Rolling dice for turn order…");
        setTimeout(() => send(idx, { type: "roll_dice" }), 150 + idx * 150);
      }
    }

    // Place pieces: auto-place in turn order
    if (phase === "place_pieces") {
      const placer = (msg.turn_order ?? [])[msg.placement_idx ?? 0];
      setAutoMsg(`Placing pieces… (${placer}'s turn)`);
      autoPlacePiece(idx, msg);
    }

    // Draft: host auto-advances to board
    if (phase === "draft") {
      setAutoMsg("Draft complete — starting board…");
      if (!autoBeginAction && p.role === "host") {
        autoBeginAction = true;
        setTimeout(() => { send(idx, { type: "begin_action" }); setAutoMsg(""); }, 800);
      }
    }

    // Board: auto-play — try actions then end turn
    if (phase === "board") {
      advanceStep("playing");
      document.getElementById("btn-pause").disabled = false;
      const currentTurn = msg.current_turn;
      const round       = msg.round ?? 1;
      const seq         = msg.seq ?? 0;
      const actLeft     = msg.actions_remaining ?? 0;
      if (round > _statFinalRound) _statFinalRound = round;
      setAutoMsg(`Round ${round} — ${currentTurn ?? "?"}'s turn`);
      if (round > _lastRoundLogged) {
        _lastRoundLogged = round;
        for (let ri = 0; ri < panels.length; ri++)
          sysLog(ri, `━━━ Round ${round} ━━━`);
      }
      if (currentTurn === p.name && !autoPaused) {
        const seqChanged     = seq !== p.lastEndTurnSeq;
        const actionsChanged = actLeft !== p.lastActionsRemaining && actLeft >= 0;
        // Skip invasion_prompt messages — start_invasion is sent by the invasion handler below
        const isInvasionPrompt = msg.type === "invasion_prompt";
        if (!isInvasionPrompt && (seqChanged || actionsChanged)) {
          if (seqChanged) p.lastEndTurnSeq = seq;
          p.lastActionsRemaining = actLeft;
          if (actLeft > 0) {
            setTimeout(() => autoTurnAction(idx, msg), 500 + idx * 80);
          } else {
            setTimeout(() => {
              sysLog(idx, `No actions left — end_turn (round ${round})`);
              send(idx, { type: "end_turn" });
            }, 500 + idx * 150);
          }
        }
      }
      if (autoPaused && msg.current_turn === p.name) {
        p.lastEndTurnSeq = seq;
        p.lastActionsRemaining = actLeft;
      }
    }

    // Panel turn glow
    for (let i = 0; i < panels.length; i++) {
      panels[i].el.classList.toggle("myturn", msg.current_turn === panels[i].name);
    }
  }

  // ── Message handler ───────────────────────────────────────────────────────
  function handleMsg(idx, msg) {
    log(idx, "in", msg);
    const p = panels[idx];

    if (msg.type === "joined") {
      p.role = msg.role;
      p.roleEl.textContent = msg.role;
      p.roleEl.className   = `role-badge ${msg.role}`;
      p.dotEl.className    = "conn-dot on";
      p.el.classList.add("connected");
      if (msg.role === "host") {
        gameCode = msg.code;
        document.getElementById("info-code").textContent = msg.code;
        advanceStep("lobby");
        setAutoMsg(`Game created (${msg.code}) — joining other players…`);
        let delay = 220;
        for (let i = 1; i < playerCount; i++) {
          setTimeout(() => connectPlayer(i, msg.code), delay);
          delay += 220;
        }
      } else {
        sysLog(idx, `Joined lobby as ${msg.role}`);
      }
    }

    // All state-bearing message types share the same handler
    if (["game_state","place_pieces_start","draft_start","board_ready","combat_result","invasion_result","invasion_prompt"].includes(msg.type)) {
      handleState(idx, msg);
    }

    // Combat: auto-roll as attacker
    if (msg.type === "combat_prompt") {
      sysLog(idx, `⚔ Attacker! vs ${msg.defender ?? "?"} at cluster ${msg.dest_cluster ?? "?"}`);
      if (!autoPaused) {
        setTimeout(() => send(idx, { type: "roll_combat_dice" }), 350);
      } else {
        const p = panels[idx];
        const btn = mkBtn("🎲 Roll Attack Dice", "btn-step", () => { btn.remove(); send(idx, { type: "roll_combat_dice" }); });
        p.actEl.appendChild(btn);
      }
    }

    // Invasion: auto-roll or show manual button when paused
    if (msg.type === "invasion_prompt") {
      const defD = msg.def_dice_count ?? "?";
      const atkD = msg.atk_count ?? 1;
      sysLog(idx, `🎲 Invasion cl:${msg.dest_cluster} — atk:${atkD}d def:${defD}d${msg.planet?.ancient ? " (ANCIENT)" : ""}`);
      if (!autoPaused) {
        setTimeout(() => send(idx, { type: "start_invasion" }), 400 + idx * 80);
      } else {
        const btn = mkBtn("🎲 Roll Invasion Dice", "btn-step", () => { btn.remove(); send(idx, { type: "start_invasion" }); });
        panels[idx].actEl.appendChild(btn);
      }
    }

    // Combat: auto-roll as defender
    if (msg.type === "combat_defender_prompt") {
      sysLog(idx, `🛡 Defender! vs ${msg.attacker ?? "?"} at cluster ${msg.dest_cluster ?? "?"}`);
      if (!autoPaused) {
        setTimeout(() => send(idx, { type: "roll_combat_dice" }), 350 + idx * 80);
      } else {
        const p = panels[idx];
        const btn = mkBtn("🎲 Roll Defense Dice", "btn-step", () => { btn.remove(); send(idx, { type: "roll_combat_dice" }); });
        p.actEl.appendChild(btn);
      }
    }

    if (msg.game_over) {
      const winner = msg.game_over;
      const mins = estimateRealMinutes();
      const timeStr = formatMinutes(mins);
      for (let i = 0; i < panels.length; i++) {
        sysLog(i, `🏆 GAME OVER — ${winner} wins!`);
        sysLog(i, `⏱ Real-pace estimate: ~${timeStr}  (${_statFinalRound} rounds · ${_statTurns} turns · ${_statInvasions} invasions · ${_statCombats} combats)`);
      }
      autoPaused = true;
      const btn = document.getElementById("btn-pause");
      btn.classList.add("paused");
      btn.innerHTML = "&#9654; Resume";
      setAutoMsg(`🏆 ${winner} wins! Estimated real-pace duration: ~${timeStr}`);
    }

    if (msg.type === "eliminated") {
      log(idx, "sys", `ELIMINATED: ${msg.msg ?? "removed from game"}`);
      panels[idx].eliminated = true;
    }

    if (msg.type === "error") {
      log(idx, "err", msg.msg ?? JSON.stringify(msg));
      const state = panels[idx].lastState;
      if (state?.phase === "place_pieces") {
        const order = state.turn_order ?? [];
        const pi    = state.placement_idx ?? 0;
        if (pi < order.length && order[pi] === panels[idx].name) {
          sysLog(idx, "Placement rejected — retrying…");
          setTimeout(() => autoPlacePiece(idx, state), 800);
        }
      } else if (state?.phase === "board" && state.current_turn === panels[idx].name) {
        // Board action rejected — end turn to avoid infinite retry loops
        sysLog(idx, "Action rejected — ending turn");
        send(idx, { type: "end_turn" });
      }
    }
  }

  // ── Turn strip ────────────────────────────────────────────────────────────
  function renderTurnStrip(state) {
    const strip = document.getElementById("turn-strip");
    const inner = document.getElementById("turn-strip-inner");
    const order = state.turn_order ?? (state.players ?? []).map(p => p.name);
    if (!order.length) return;
    strip.classList.add("visible");

    const allPlayers = state.players ?? [];
    let html = "";
    order.forEach((name, i) => {
      const pl    = allPlayers.find(p => p.name === name);
      const color = pl?.race ? (RACE_COLORS[pl.race] ?? "#64748b") : "#64748b";
      const active = state.current_turn === name;
      html += `<div class="turn-chip${active?" active":""}">
        <div class="race-dot" style="background:${color}"></div>${name}
      </div>`;
      if (i < order.length - 1) html += `<span class="turn-arrow">›</span>`;
    });
    inner.innerHTML = html;
  }

  // ── Render race banner ────────────────────────────────────────────────────
  function renderRace(idx, state) {
    const me    = (state.players ?? []).find(pl => pl.name === panels[idx].name);
    const race  = me?.race ?? assignedRaces[idx];
    const color = RACE_COLORS[race] ?? "#64748b";
    const locked = !!me?.race;
    const raceEl = panels[idx].raceEl;

    raceEl.className = `race-assigned ${locked ? "locked" : "pending"}`;
    raceEl.style.borderColor = color + (locked ? "88" : "33");
    raceEl.style.background  = color + (locked ? "1a" : "0d");

    document.getElementById(`race-swatch-${idx}`).style.background = color + (locked ? "" : "88");
    document.getElementById(`race-lbl-${idx}`).style.color = color + (locked ? "" : "99");
    document.getElementById(`race-lbl-${idx}`).textContent = RACE_LABELS[race] ?? race;
    document.getElementById(`race-status-${idx}`).textContent = locked ? "✓ locked in" : "assigned";

    const vp = me?.vp ?? me?.victory_points;
    document.getElementById(`race-vp-${idx}`).textContent = vp != null ? `${vp} VP` : "";

    // Tint panel top border to race color
    panels[idx].el.style.borderTopColor = color + (locked ? "cc" : "44");

    if (locked) panels[idx].el.classList.add("phase-flash");
  }

  // ── Render resources ──────────────────────────────────────────────────────
  function renderResources(idx, state) {
    const me = (state.players ?? []).find(pl => pl.name === panels[idx].name);
    if (!me) return;
    const res    = me.resources ?? {};
    const income = me.income    ?? {};
    const upkeep = me.upkeep   ?? {};
    RES_KEYS.forEach(k => {
      const valEl = document.getElementById(`res-${idx}-${k}`);
      const incEl = document.getElementById(`inc-${idx}-${k}`);
      if (valEl) valEl.textContent = res[k] ?? 0;
      if (incEl) {
        const n = (income[k] ?? 0) - (upkeep[k] ?? 0);
        incEl.textContent = n !== 0 ? `${n>0?"+":""}${n}/turn` : "";
        incEl.className   = `res-inc ${n>0?"pos":n<0?"neg":""}`;
      }
    });
  }

  // ── Render action buttons ─────────────────────────────────────────────────
  function renderActions(idx, state) {
    const p      = panels[idx];
    const phase  = state.phase ?? "";
    const myTurn = state.current_turn === p.name;
    const btns   = [];

    if (phase === "lobby" && p.role === "host") {
      const b = mkBtn("▶ Start Game", "btn-start btn-sm", () => send(idx, {type:"start_game"}));
      btns.push(b);
    }

    if (phase === "race_pick") {
      const me = (state.players ?? []).find(pl => pl.name === p.name);
      if (!me?.race) {
        const race  = RACES[(p.raceIdx ?? idx) % RACES.length];
        const color = RACE_COLORS[race];
        const pb = mkBtn(`Pick: ${RACE_LABELS[race]}`, "btn-action btn-sm", () => {
          send(idx, {type:"pick_race", race});
        });
        pb.style.borderColor = color + "99";
        pb.style.color       = color;
        btns.push(pb);
      }
    }

    if (myTurn && !["lobby","race_pick","dice_roll"].includes(phase)) {
      p.roleEl.textContent = "YOUR TURN";
      p.roleEl.className   = "role-badge turn";
      btns.push(mkBtn("End Turn", "btn-end btn-sm", () => send(idx, {type:"end_turn"})));
      btns.push(mkBtn("Roll Dice", "btn-action btn-sm", () => send(idx, {type:"roll_dice"})));
    } else if (!["lobby","race_pick"].includes(phase) && p.role) {
      if (p.roleEl.textContent === "YOUR TURN") {
        p.roleEl.textContent = p.role;
        p.roleEl.className   = `role-badge ${p.role}`;
      }
    }

    p.actEl.innerHTML = "";
    btns.forEach(b => p.actEl.appendChild(b));
  }

  function mkBtn(label, cls, onClick) {
    const b = document.createElement("button");
    b.className = cls;
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }

  // ── Connect ───────────────────────────────────────────────────────────────
  function connectPlayer(idx, code) {
    const p      = panels[idx];
    const isHost = idx === 0;
    if (p.ws) { try { p.ws.close(); } catch(_){} p.ws = null; }

    p.dotEl.className    = "conn-dot wait";
    p.roleEl.textContent = "connecting…";
    p.roleEl.className   = "role-badge";
    p.ws = new WebSocket(WS_BASE + (isHost ? "NEW" : code));

    p.ws.onopen = () => {
      p.dotEl.className = "conn-dot on";
      send(idx, isHost
        ? {type:"host", name:p.name}
        : {type:"join", name:p.name, code});
    };

    p.ws.onmessage = e => { try { handleMsg(idx, JSON.parse(e.data)); } catch(_){} };

    p.ws.onclose = () => {
      p.dotEl.className    = "conn-dot err";
      p.roleEl.textContent = "offline";
      p.roleEl.className   = "role-badge";
      p.el.classList.remove("connected","myturn");
      p.el.style.borderTopColor = "";
    };

    p.ws.onerror = () => { p.dotEl.className = "conn-dot err"; log(idx,"err","WS error"); };
  }

  // ── Step back / forward ───────────────────────────────────────────────────
  function updateStepButtons() {
    const bk = document.getElementById("btn-step-back");
    const fw = document.getElementById("btn-step-fwd");
    if (!bk || !fw) return;
    bk.disabled = historyIdx <= 0;
    fw.disabled  = historyIdx < 0;
  }

  function highlightHistoryLogs(entry) {
    document.querySelectorAll(".log-line.step-highlight").forEach(el => el.classList.remove("step-highlight"));
    if (!entry?.logLines) return;
    for (const line of entry.logLines) {
      if (line) {
        line.classList.add("step-highlight");
      }
    }
  }

  function stepBack() {
    if (historyIdx <= 0) return;
    // Auto-pause so the live game stops while browsing history
    if (!autoPaused) {
      autoPaused = true;
      const btn = document.getElementById("btn-pause");
      btn.classList.add("paused");
      btn.innerHTML = "&#9654; Resume";
      setAutoMsg("⏸ Paused — stepping through history");
    }
    historyIdx--;
    const entry = stateHistory[historyIdx];
    if (entry) renderMiniBoard(entry.state);
    highlightHistoryLogs(entry);
    updateStepButtons();
  }

  function stepForward() {
    // If not at the live end of history: advance one snapshot
    if (historyIdx < stateHistory.length - 1) {
      historyIdx++;
      const entry = stateHistory[historyIdx];
      if (entry) renderMiniBoard(entry.state);
      highlightHistoryLogs(entry);
      updateStepButtons();
      return;
    }
    // At live end while paused: execute exactly one auto-action
    if (historyIdx < 0) return;
    const liveState = panels.find(p => p.lastState)?.lastState;
    if (!liveState || liveState.phase !== "board") return;
    const currentTurn = liveState.current_turn;
    const pidx = panels.findIndex(p => p.name === currentTurn);
    if (pidx < 0) return;
    const p = panels[pidx];
    const actLeft = liveState.actions_remaining ?? 0;
    if (actLeft > 0) {
      autoTurnAction(pidx, p.lastState ?? liveState, true);
    } else {
      sysLog(pidx, "Step: end_turn");
      send(pidx, { type: "end_turn" });
    }
  }

  // ── Controls ──────────────────────────────────────────────────────────────
  function resetAll() {
    panels.forEach(p => { try { p.ws?.close(); } catch(_){} });
    panels = [];
    gameCode          = null;
    autoStarted       = false;
    autoRacePicked    = [];
    autoRaceConfirmed = false;
    autoBeginAction   = false;
    lastBoard         = null;
    autoPaused        = false;
    stateHistory      = [];
    historyIdx        = -1;
    _prevBoard        = null;
    _hexCoords        = {};
    _activeTrails     = [];
    _statTurns        = 0;
    _statInvasions    = 0;
    _statCombats      = 0;
    _statFinalRound   = 0;
    document.getElementById("btn-step-back").disabled = true;
    document.getElementById("btn-step-fwd").disabled  = true;
    const pauseBtn = document.getElementById("btn-pause");
    pauseBtn.disabled = true;
    pauseBtn.classList.remove("paused");
    pauseBtn.innerHTML = "&#9646;&#9646; Pause";
    ["info-code","info-phase","info-round"].forEach(id => document.getElementById(id).textContent = "—");
    document.getElementById("turn-strip").classList.remove("visible");
    document.getElementById("phase-stepper").classList.remove("visible");
    document.getElementById("auto-bar").classList.remove("visible");
    document.getElementById("panel-grid").innerHTML = "";
  }

  function launch(count) {
    resetAll();
    buildPanels(count);
    setAutoMsg(`Connecting ${count} players…`);
    connectPlayer(0, null);
  }

  document.getElementById("btn-3p").addEventListener("click", () => launch(3));
  document.getElementById("btn-4p").addEventListener("click", () => launch(4));
  document.getElementById("btn-5p").addEventListener("click", () => launch(5));
  document.getElementById("btn-6p").addEventListener("click", () => launch(6));
  document.getElementById("btn-reset").addEventListener("click", resetAll);
  document.getElementById("btn-pause").addEventListener("click", () => {
    autoPaused = !autoPaused;
    const btn = document.getElementById("btn-pause");
    btn.classList.toggle("paused", autoPaused);
    btn.innerHTML = autoPaused ? "&#9654; Resume" : "&#9646;&#9646; Pause";
    setAutoMsg(autoPaused ? "⏸ Paused — click Resume to continue" : "");
    if (!autoPaused) {
      // Resuming: jump back to live state and re-render
      historyIdx = stateHistory.length - 1;
      const liveState = panels.find(p => p.lastState)?.lastState;
      if (liveState) renderMiniBoard(liveState);
      updateStepButtons();
    }
  });
  document.getElementById("btn-step-back").addEventListener("click", stepBack);
  document.getElementById("btn-step-fwd").addEventListener("click", stepForward);

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowLeft")  { e.preventDefault(); stepBack(); }
    if (e.key === "ArrowRight") { e.preventDefault(); stepForward(); }
  });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSS — Multi-Player Test Harness</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #080c14;
      --surface: #0f1623;
      --border:  #1e2d45;
      --accent:  #38bdf8;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --danger:  #ef4444;
      --gold:    #f59e0b;
      --green:   #22c55e;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: .75rem 1rem 2rem; min-height: 100vh;
    }

    /* ── Nav ── */
    .site-nav { display: flex; gap: 1.25rem; margin-bottom: .75rem; font-size: .85rem; }
    .site-nav a { color: var(--muted); text-decoration: none; }
    .site-nav a.active { color: var(--accent); font-weight: 600; }
    .site-nav a:hover { color: var(--text); }
    h1 { color: var(--accent); font-size: 1.05rem; font-weight: 700;
         letter-spacing: .04em; margin-bottom: .65rem; }

    /* ── Top bar ── */
    .top-bar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .65rem; }
    .pill { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: .28rem .65rem; font-size: .8rem; }
    .pill-label { color: var(--muted); margin-right: .25rem; }
    .pill-val   { color: var(--accent); font-weight: 700; }

    /* ── Buttons ── */
    button { border: none; border-radius: 6px; padding: .38rem .85rem; font-size: .82rem; font-weight: 700; cursor: pointer; transition: filter .15s; }
    button:hover:not(:disabled) { filter: brightness(1.15); }
    button:disabled { opacity: .35; cursor: default; }
    .btn-3p  { background: #7c3aed; color: #fff; }
    .btn-4p  { background: var(--accent); color: #0a0f18; }
    .btn-rst { background: var(--danger); color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-sm { font-size: .73rem; padding: .25rem .5rem; }
    .btn-action { background: #1e3a5a; color: var(--accent); border: 1px solid #2a4f78; }
    .btn-start  { background: var(--green); color: #071a0f; }
    .btn-end    { background: #1a1a2e; color: #a78bfa; border: 1px solid #3730a3; }

    /* ── Phase progress stepper ── */
    .phase-stepper {
      display: none; align-items: center; gap: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: .45rem .85rem;
      margin-bottom: .6rem; overflow-x: auto;
    }
    .phase-stepper.visible { display: flex; }
    .step {
      display: flex; align-items: center; gap: .35rem;
      font-size: .72rem; font-weight: 600; color: var(--muted);
      white-space: nowrap; padding: 0 .2rem;
    }
    .step-circle {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--border); display: flex;
      align-items: center; justify-content: center;
      font-size: .6rem; font-weight: 800; flex-shrink: 0;
      transition: all .3s;
    }
    .step.done   .step-circle { background: var(--green);  border-color: var(--green);  color: #071a0f; }
    .step.active .step-circle { background: var(--gold);   border-color: var(--gold);   color: #0a0800; animation: stepPulse 1.2s ease-in-out infinite; }
    .step.done   { color: var(--green); }
    .step.active { color: var(--gold); }
    @keyframes stepPulse { 0%,100%{box-shadow:0 0 0 0 #f59e0b55} 50%{box-shadow:0 0 0 5px #f59e0b00} }
    .step-arrow { color: var(--border); font-size: .85rem; padding: 0 .15rem; }
    .step.done + .step-arrow  { color: var(--green); }
    .step.active + .step-arrow { color: var(--gold); }

    /* ── Auto-status bar ── */
    .auto-bar {
      display: none; align-items: center; gap: .6rem;
      background: #0a1a0a; border: 1px solid #1a3a1a;
      border-radius: 7px; padding: .35rem .75rem;
      margin-bottom: .6rem; font-size: .78rem; color: var(--green);
    }
    .auto-bar.visible { display: flex; }
    .auto-spinner {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid #22c55e44; border-top-color: var(--green);
      animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Turn strip ── */
    .turn-strip {
      display: none; align-items: center; gap: .4rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: .4rem .75rem;
      margin-bottom: .65rem; flex-wrap: wrap;
    }
    .turn-strip.visible { display: flex; }
    .turn-strip-label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-right: .25rem; }
    .turn-chip {
      display: flex; align-items: center; gap: .3rem;
      background: #0a0f18; border: 1px solid var(--border);
      border-radius: 5px; padding: .2rem .5rem; font-size: .78rem;
      transition: all .25s;
    }
    .turn-chip.active { border-color: var(--gold); color: var(--gold); background: #1a1200; font-weight: 700; box-shadow: 0 0 8px #f59e0b44; }
    .turn-chip .race-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .turn-arrow { color: var(--muted); font-size: .7rem; }

    /* ── Panel grid ── */
    .panel-grid { display: grid; gap: .65rem; }
    .panel-grid.g3 { grid-template-columns: repeat(3, 1fr); }
    .panel-grid.g4 { grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 820px) { .panel-grid.g3, .panel-grid.g4 { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 500px)  { .panel-grid.g3, .panel-grid.g4 { grid-template-columns: 1fr; } }

    /* ── Panel ── */
    .panel {
      background: var(--surface); border: 2px solid var(--border);
      border-top: 3px solid var(--border); border-radius: 10px; padding: .65rem;
      display: flex; flex-direction: column; gap: .45rem;
      transition: border-color .3s, box-shadow .3s;
    }
    .panel.connected   { border-top-color: #22c55e55; }
    .panel.myturn      { border-color: var(--gold); box-shadow: 0 0 18px #f59e0b2a; }
    .panel.phase-flash { animation: flashPanel .5s ease-out; }
    @keyframes flashPanel { 0%{background:#1a2a0a} 100%{background:var(--surface)} }

    /* ── Panel header ── */
    .panel-hdr { display: flex; align-items: center; gap: .45rem; padding-bottom: .4rem; border-bottom: 1px solid var(--border); }
    .conn-dot  { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background .2s; }
    .conn-dot.on  { background: var(--green); box-shadow: 0 0 6px #22c55e88; }
    .conn-dot.err { background: var(--danger); }
    .conn-dot.wait { background: var(--gold); animation: pulse 1s infinite; }
    .panel-name { font-weight: 700; font-size: .95rem; flex: 1; }
    .role-badge { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border-radius: 4px; padding: .1rem .38rem; background: #1e2d45; color: var(--muted); }
    .role-badge.host   { background: #2a1d00; color: var(--gold); border: 1px solid #6b4500; }
    .role-badge.player { background: #0a2418; color: var(--green); border: 1px solid #155235; }
    .role-badge.turn   { background: #0a2418; color: var(--green); border: 1px solid var(--green); animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* ── Race assignment preview ── */
    .race-assigned {
      display: flex; align-items: center; gap: .5rem;
      border-radius: 6px; padding: .3rem .55rem;
      font-size: .78rem; font-weight: 600;
      border: 1px solid #1e2d45; transition: all .4s;
    }
    .race-assigned.pending { opacity: .45; font-style: italic; }
    .race-assigned.locked  { opacity: 1; }
    .race-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; transition: background .4s; }
    .race-label  { flex: 1; }
    .race-status { font-size: .65rem; color: var(--muted); }
    .race-vp     { color: var(--gold); font-size: .72rem; }

    /* ── Resources ── */
    .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .3rem; }
    .res-block { border-radius: 6px; padding: .3rem .5rem; display: flex; align-items: center; justify-content: space-between; font-size: .8rem; }
    .res-block.food    { background: #0d2218; border: 1px solid #14532d; }
    .res-block.science { background: #0a1c2e; border: 1px solid #1e3a5a; }
    .res-block.tool    { background: #1c1400; border: 1px solid #451a00; }
    .res-block.money   { background: #1c1600; border: 1px solid #713f12; }
    .res-label { color: var(--muted); font-size: .65rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    .res-val   { font-weight: 700; font-size: .95rem; }
    .res-block.food    .res-val { color: #4ade80; }
    .res-block.science .res-val { color: var(--accent); }
    .res-block.tool    .res-val { color: #fb923c; }
    .res-block.money   .res-val { color: #fbbf24; }
    .res-inc { font-size: .63rem; }
    .res-inc.pos { color: #4ade8077; }
    .res-inc.neg { color: #f8717177; }

    /* ── Log ── */
    .log-label { font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-bottom: .2rem; }
    .log { background: #050810; border: 1px solid var(--border); border-radius: 6px; padding: .35rem .45rem; font-size: .67rem; font-family: monospace; color: var(--muted); height: 88px; overflow-y: auto; }
    .log-line { margin-bottom: .07rem; line-height: 1.35; word-break: break-all; }
    .log-line.in  { color: #7dd3fc; }
    .log-line.out { color: #86efac; }
    .log-line.err { color: var(--danger); }
    .log-line.sys { color: var(--gold); }

    /* ── Actions ── */
    .act-row { display: flex; flex-wrap: wrap; gap: .3rem; min-height: 1.8rem; }

    /* ── Raw send ── */
    .send-row { display: flex; gap: .3rem; }
    .send-inp { flex: 1; min-width: 0; background: #0a0f18; border: 1px solid var(--border); border-radius: 5px; color: var(--text); padding: .28rem .45rem; font-size: .68rem; font-family: monospace; }
    .send-inp:focus { outline: none; border-color: var(--accent); }
  </style>
</head>
<body>

  <nav class="site-nav">
    <a href="../index.html">About</a>
    <a href="./">SSS</a>
    <a href="multitest.html" class="active">SSS Test</a>
  </nav>

  <h1>SSS — Multi-Player Test Harness</h1>

  <div class="top-bar">
    <button class="btn-3p" id="btn-3p">&#9654; 3-Player Game</button>
    <button class="btn-4p" id="btn-4p">&#9654; 4-Player Game</button>
    <button class="btn-rst" id="btn-reset">&#9724; Reset</button>
    <div class="pill"><span class="pill-label">Code</span><span class="pill-val" id="info-code">—</span></div>
    <div class="pill"><span class="pill-label">Phase</span><span class="pill-val" id="info-phase">—</span></div>
    <div class="pill"><span class="pill-label">Round</span><span class="pill-val" id="info-round">—</span></div>
  </div>

  <!-- Phase stepper -->
  <div class="phase-stepper" id="phase-stepper">
    <div class="step" id="step-connect"><div class="step-circle">1</div>Connect</div>
    <span class="step-arrow">›</span>
    <div class="step" id="step-lobby"><div class="step-circle">2</div>Lobby</div>
    <span class="step-arrow">›</span>
    <div class="step" id="step-race_pick"><div class="step-circle">3</div>Race Pick</div>
    <span class="step-arrow">›</span>
    <div class="step" id="step-dice_roll"><div class="step-circle">4</div>Dice Roll</div>
    <span class="step-arrow">›</span>
    <div class="step" id="step-playing"><div class="step-circle">5</div>Playing</div>
  </div>

  <!-- Auto-status -->
  <div class="auto-bar" id="auto-bar">
    <div class="auto-spinner"></div>
    <span id="auto-msg">Setting up…</span>
  </div>

  <!-- Turn strip -->
  <div class="turn-strip" id="turn-strip">
    <span class="turn-strip-label">Turn Order</span>
    <span id="turn-strip-inner"></span>
  </div>

  <div class="panel-grid" id="panel-grid"></div>

  <script>
  "use strict";

  const NAMES = ["Alice", "Bob", "Carol", "Dave"];
  const RACES = ["vorrkai","nexari","luminae","thornveld","obsidian_pact","dust_runners"];
  const RACE_COLORS = {
    vorrkai:       "#e74c3c",
    nexari:        "#1a8fe8",
    luminae:       "#e040fb",
    thornveld:     "#27ae60",
    obsidian_pact: "#9b59b6",
    dust_runners:  "#c0834a",
  };
  const RACE_LABELS = {
    vorrkai:       "Vorrkai",
    nexari:        "Nexari",
    luminae:       "Luminae",
    thornveld:     "Thornveld",
    obsidian_pact: "Obsidian Pact",
    dust_runners:  "Dust Runners",
  };
  const RES_KEYS = ["food","science","tool","money"];
  const PHASE_ORDER = ["connect","lobby","race_pick","dice_roll","playing"];
  const WS_BASE = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/sss/ws/`;

  let gameCode       = null;
  let playerCount    = 4;
  let panels         = [];
  let assignedRaces  = [];   // pre-shuffled race per panel index
  let autoStarted    = false; // guard: don't send start_game twice
  let autoRacePicked = [];    // guard per panel

  // ── Shuffle helper ────────────────────────────────────────────────────────
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ── Build DOM ─────────────────────────────────────────────────────────────
  function buildPanels(count) {
    playerCount    = count;
    autoStarted    = false;
    autoRacePicked = Array(count).fill(false);
    assignedRaces  = shuffle(RACES).slice(0, count);

    const grid = document.getElementById("panel-grid");
    grid.innerHTML   = "";
    grid.className   = `panel-grid g${count}`;
    panels = [];

    document.getElementById("turn-strip").classList.remove("visible");
    document.getElementById("turn-strip-inner").innerHTML = "";
    document.getElementById("phase-stepper").classList.add("visible");
    document.getElementById("auto-bar").classList.remove("visible");
    setAutoMsg("");

    PHASE_ORDER.forEach(p => {
      const el = document.getElementById(`step-${p}`);
      if (el) el.className = "step";
    });
    advanceStep("connect");

    for (let i = 0; i < count; i++) {
      const race  = assignedRaces[i];
      const color = RACE_COLORS[race];
      const el = document.createElement("div");
      el.className = "panel";
      el.id = `panel-${i}`;
      el.innerHTML = `
        <div class="panel-hdr">
          <div class="conn-dot wait" id="dot-${i}"></div>
          <span class="panel-name">${NAMES[i]}</span>
          <span class="role-badge" id="role-${i}">connecting…</span>
        </div>
        <div class="race-assigned pending" id="race-${i}" style="border-color:${color}33;background:${color}0d">
          <div class="race-swatch" style="background:${color}88" id="race-swatch-${i}"></div>
          <span class="race-label" style="color:${color}99" id="race-lbl-${i}">${RACE_LABELS[race]}</span>
          <span class="race-status" id="race-status-${i}">assigned</span>
          <span class="race-vp" id="race-vp-${i}"></span>
        </div>
        <div class="res-grid" id="res-${i}">
          ${RES_KEYS.map(k => `
          <div class="res-block ${k}">
            <span class="res-label">${k}</span>
            <div style="text-align:right">
              <div class="res-val" id="res-${i}-${k}">—</div>
              <div class="res-inc" id="inc-${i}-${k}"></div>
            </div>
          </div>`).join("")}
        </div>
        <div>
          <div class="log-label">Message log</div>
          <div class="log" id="log-${i}"></div>
        </div>
        <div class="act-row" id="act-${i}"></div>
        <div class="send-row">
          <input class="send-inp" type="text" id="send-${i}" placeholder='{"type":"end_turn"}'>
          <button class="btn-ghost btn-sm" onclick="sendRaw(${i})">Send</button>
        </div>`;
      grid.appendChild(el);

      panels.push({
        ws: null, name: NAMES[i], role: null, lastState: null,
        el,
        dotEl:   document.getElementById(`dot-${i}`),
        roleEl:  document.getElementById(`role-${i}`),
        raceEl:  document.getElementById(`race-${i}`),
        logEl:   document.getElementById(`log-${i}`),
        actEl:   document.getElementById(`act-${i}`),
        sendEl:  document.getElementById(`send-${i}`),
      });
    }
  }

  // ── Phase stepper ─────────────────────────────────────────────────────────
  function advanceStep(phase) {
    let found = false;
    PHASE_ORDER.forEach(p => {
      const el = document.getElementById(`step-${p}`);
      if (!el) return;
      if (found) { el.className = "step"; return; }
      if (p === phase) { el.className = "step active"; found = true; }
      else             { el.className = "step done"; }
    });
  }

  // ── Auto-status bar ───────────────────────────────────────────────────────
  function setAutoMsg(msg) {
    const bar = document.getElementById("auto-bar");
    const txt = document.getElementById("auto-msg");
    if (msg) { bar.classList.add("visible"); txt.textContent = msg; }
    else      { bar.classList.remove("visible"); }
  }

  // ── Log ───────────────────────────────────────────────────────────────────
  function log(idx, dir, payload) {
    const el   = panels[idx].logEl;
    const line = document.createElement("div");
    line.className = `log-line ${dir}`;
    const text = typeof payload === "object" ? JSON.stringify(payload) : String(payload);
    const ts   = new Date().toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});
    line.textContent = `${ts} ${text}`;
    el.appendChild(line);
    while (el.children.length > 80) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
  }

  function sysLog(idx, msg) {
    const el   = panels[idx].logEl;
    const line = document.createElement("div");
    line.className = "log-line sys";
    line.textContent = `★ ${msg}`;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  // ── Send ──────────────────────────────────────────────────────────────────
  function send(idx, obj) {
    const p = panels[idx];
    if (!p.ws || p.ws.readyState !== WebSocket.OPEN) { log(idx,"err","Not connected"); return; }
    log(idx, "out", obj);
    p.ws.send(JSON.stringify(obj));
  }

  function sendRaw(idx) {
    const inp = panels[idx].sendEl;
    try { send(idx, JSON.parse(inp.value)); inp.value = ""; }
    catch (e) { log(idx, "err", "Bad JSON: " + e.message); }
  }

  // ── Message handler ───────────────────────────────────────────────────────
  function handleMsg(idx, msg) {
    log(idx, "in", msg);
    const p = panels[idx];

    if (msg.type === "joined") {
      p.role = msg.role;
      p.roleEl.textContent = msg.role;
      p.roleEl.className   = `role-badge ${msg.role}`;
      p.dotEl.className    = "conn-dot on";
      p.el.classList.add("connected");

      if (msg.role === "host") {
        gameCode = msg.code;
        document.getElementById("info-code").textContent = msg.code;
        advanceStep("lobby");
        setAutoMsg(`Game created (${msg.code}) — joining other players…`);
        let delay = 220;
        for (let i = 1; i < playerCount; i++) {
          setTimeout(() => connectPlayer(i, msg.code), delay);
          delay += 220;
        }
      } else {
        sysLog(idx, `Joined lobby as ${msg.role}`);
      }
    }

    if (msg.type === "game_state") {
      p.lastState = msg;
      const phase = msg.phase ?? "";
      document.getElementById("info-phase").textContent = phase;
      document.getElementById("info-round").textContent = msg.round ?? "—";

      renderResources(idx, msg);
      renderRace(idx, msg);
      renderActions(idx, msg);
      renderTurnStrip(msg);

      // Phase stepper + auto-actions
      if (phase !== "connect") advanceStep(phase);

      // Lobby: auto-start when all players present
      if (phase === "lobby") {
        const joined = (msg.players ?? []).length;
        if (joined === playerCount && !autoStarted && p.role === "host") {
          autoStarted = true;
          advanceStep("lobby");
          setAutoMsg(`All ${playerCount} players in lobby — starting game…`);
          setTimeout(() => {
            send(idx, { type: "start_game" });
            setAutoMsg("Starting game…");
          }, 700);
        }
      }

      // Race pick: auto-pick assigned race
      if (phase === "race_pick") {
        advanceStep("race_pick");
        const me = (msg.players ?? []).find(pl => pl.name === p.name);
        if (!me?.race && !autoRacePicked[idx]) {
          autoRacePicked[idx] = true;
          const race = assignedRaces[idx];
          setAutoMsg(`Auto-picking races…`);
          setTimeout(() => {
            send(idx, { type: "pick_race", race });
            sysLog(idx, `Auto-picked ${RACE_LABELS[race]}`);
          }, 300 + idx * 400);
        }
      }

      // Dice roll: auto-roll
      if (phase === "dice_roll") {
        advanceStep("dice_roll");
        const me = (msg.players ?? []).find(pl => pl.name === p.name);
        if (me && !me.roll) {
          setTimeout(() => send(idx, { type: "roll_dice" }), 400 + idx * 350);
        }
      }

      // Playing — all setup done
      if (phase === "playing" || phase === "income" || phase === "action") {
        advanceStep("playing");
        setAutoMsg("");
      }

      // Panel border glow for active turn
      for (let i = 0; i < panels.length; i++) {
        panels[i].el.classList.toggle("myturn", msg.current_turn === panels[i].name);
      }
    }

    if (msg.type === "error") log(idx, "err", msg.msg ?? JSON.stringify(msg));
  }

  // ── Turn strip ────────────────────────────────────────────────────────────
  function renderTurnStrip(state) {
    const strip = document.getElementById("turn-strip");
    const inner = document.getElementById("turn-strip-inner");
    const order = state.turn_order ?? (state.players ?? []).map(p => p.name);
    if (!order.length) return;
    strip.classList.add("visible");

    const allPlayers = state.players ?? [];
    let html = "";
    order.forEach((name, i) => {
      const pl    = allPlayers.find(p => p.name === name);
      const color = pl?.race ? (RACE_COLORS[pl.race] ?? "#64748b") : "#64748b";
      const active = state.current_turn === name;
      html += `<div class="turn-chip${active?" active":""}">
        <div class="race-dot" style="background:${color}"></div>${name}
      </div>`;
      if (i < order.length - 1) html += `<span class="turn-arrow">›</span>`;
    });
    inner.innerHTML = html;
  }

  // ── Render race banner ────────────────────────────────────────────────────
  function renderRace(idx, state) {
    const me    = (state.players ?? []).find(pl => pl.name === panels[idx].name);
    const race  = me?.race ?? assignedRaces[idx];
    const color = RACE_COLORS[race] ?? "#64748b";
    const locked = !!me?.race;
    const raceEl = panels[idx].raceEl;

    raceEl.className = `race-assigned ${locked ? "locked" : "pending"}`;
    raceEl.style.borderColor = color + (locked ? "88" : "33");
    raceEl.style.background  = color + (locked ? "1a" : "0d");

    document.getElementById(`race-swatch-${idx}`).style.background = color + (locked ? "" : "88");
    document.getElementById(`race-lbl-${idx}`).style.color = color + (locked ? "" : "99");
    document.getElementById(`race-lbl-${idx}`).textContent = RACE_LABELS[race] ?? race;
    document.getElementById(`race-status-${idx}`).textContent = locked ? "✓ locked in" : "assigned";

    const vp = me?.vp ?? me?.victory_points;
    document.getElementById(`race-vp-${idx}`).textContent = vp != null ? `${vp} VP` : "";

    // Tint panel top border to race color
    panels[idx].el.style.borderTopColor = color + (locked ? "cc" : "44");

    if (locked) panels[idx].el.classList.add("phase-flash");
  }

  // ── Render resources ──────────────────────────────────────────────────────
  function renderResources(idx, state) {
    const me = (state.players ?? []).find(pl => pl.name === panels[idx].name);
    if (!me) return;
    const res    = me.resources ?? {};
    const income = me.income    ?? {};
    RES_KEYS.forEach(k => {
      const valEl = document.getElementById(`res-${idx}-${k}`);
      const incEl = document.getElementById(`inc-${idx}-${k}`);
      if (valEl) valEl.textContent = res[k] ?? 0;
      if (incEl) {
        const n = income[k] ?? 0;
        incEl.textContent = n !== 0 ? `${n>0?"+":""}${n}/turn` : "";
        incEl.className   = `res-inc ${n>0?"pos":n<0?"neg":""}`;
      }
    });
  }

  // ── Render action buttons ─────────────────────────────────────────────────
  function renderActions(idx, state) {
    const p      = panels[idx];
    const phase  = state.phase ?? "";
    const myTurn = state.current_turn === p.name;
    const btns   = [];

    if (phase === "lobby" && p.role === "host") {
      const b = mkBtn("▶ Start Game", "btn-start btn-sm", () => send(idx, {type:"start_game"}));
      btns.push(b);
    }

    if (phase === "race_pick") {
      const me = (state.players ?? []).find(pl => pl.name === p.name);
      if (!me?.race) {
        const race  = RACES[(p.raceIdx ?? idx) % RACES.length];
        const color = RACE_COLORS[race];
        const pb = mkBtn(`Pick: ${RACE_LABELS[race]}`, "btn-action btn-sm", () => {
          send(idx, {type:"pick_race", race});
        });
        pb.style.borderColor = color + "99";
        pb.style.color       = color;
        btns.push(pb);
      }
    }

    if (myTurn && !["lobby","race_pick","dice_roll"].includes(phase)) {
      p.roleEl.textContent = "YOUR TURN";
      p.roleEl.className   = "role-badge turn";
      btns.push(mkBtn("End Turn", "btn-end btn-sm", () => send(idx, {type:"end_turn"})));
      btns.push(mkBtn("Roll Dice", "btn-action btn-sm", () => send(idx, {type:"roll_dice"})));
    } else if (!["lobby","race_pick"].includes(phase) && p.role) {
      if (p.roleEl.textContent === "YOUR TURN") {
        p.roleEl.textContent = p.role;
        p.roleEl.className   = `role-badge ${p.role}`;
      }
    }

    p.actEl.innerHTML = "";
    btns.forEach(b => p.actEl.appendChild(b));
  }

  function mkBtn(label, cls, onClick) {
    const b = document.createElement("button");
    b.className = cls;
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }

  // ── Connect ───────────────────────────────────────────────────────────────
  function connectPlayer(idx, code) {
    const p      = panels[idx];
    const isHost = idx === 0;
    if (p.ws) { try { p.ws.close(); } catch(_){} p.ws = null; }

    p.dotEl.className    = "conn-dot wait";
    p.roleEl.textContent = "connecting…";
    p.roleEl.className   = "role-badge";
    p.ws = new WebSocket(WS_BASE + (isHost ? "NEW" : code));

    p.ws.onopen = () => {
      p.dotEl.className = "conn-dot on";
      send(idx, isHost
        ? {type:"host", name:p.name}
        : {type:"join", name:p.name, code});
    };

    p.ws.onmessage = e => { try { handleMsg(idx, JSON.parse(e.data)); } catch(_){} };

    p.ws.onclose = () => {
      p.dotEl.className    = "conn-dot err";
      p.roleEl.textContent = "offline";
      p.roleEl.className   = "role-badge";
      p.el.classList.remove("connected","myturn");
      p.el.style.borderTopColor = "";
    };

    p.ws.onerror = () => { p.dotEl.className = "conn-dot err"; log(idx,"err","WS error"); };
  }

  // ── Controls ──────────────────────────────────────────────────────────────
  function resetAll() {
    panels.forEach(p => { try { p.ws?.close(); } catch(_){} });
    panels = [];
    gameCode = null;
    autoStarted = false;
    autoRacePicked = [];
    ["info-code","info-phase","info-round"].forEach(id => document.getElementById(id).textContent = "—");
    document.getElementById("turn-strip").classList.remove("visible");
    document.getElementById("phase-stepper").classList.remove("visible");
    document.getElementById("auto-bar").classList.remove("visible");
    document.getElementById("panel-grid").innerHTML = "";
  }

  function launch(count) {
    resetAll();
    buildPanels(count);
    setAutoMsg(`Connecting ${count} players…`);
    connectPlayer(0, null);
  }

  document.getElementById("btn-3p").addEventListener("click", () => launch(3));
  document.getElementById("btn-4p").addEventListener("click", () => launch(4));
  document.getElementById("btn-reset").addEventListener("click", resetAll);
  </script>
</body>
</html>

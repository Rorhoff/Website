<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- planet -->
  <circle cx="10" cy="17" r="3.2" fill="#1a5296"/>
  <ellipse cx="10" cy="17" rx="5.5" ry="1.2" fill="none" stroke="#38bdf8" stroke-width=".9"/>
  <!-- center ship -->
  <path d="M10 2 L8.5 6.5 L10 6 L11.5 6.5 Z" fill="#ef4444"/>

  <line x1="10"  y1="6.5" x2="10"  y2="13.5" stroke="#f97316" stroke-width=".9" stroke-dasharray="1.5,1" stroke-linecap="round"/>
  <line x1="4"   y1="7.5" x2="6.5" y2="12.5"  stroke="#f97316" stroke-width=".7" stroke-dasharray="1.5,1" stroke-linecap="round"/>
  <line x1="16"  y1="7.5" x2="13.5" y2="12.5" stroke="#f97316" stroke-width=".7" stroke-dasharray="1.5,1" stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- cob body -->
  <rect x="7" y="5" width="6" height="10" rx="3" fill="#facc15"/>
  <!-- kernel dots: 2 columns × 3 rows -->
  <circle cx="9"  cy="7"   r="1.05" fill="#ca8a04"/>
  <circle cx="11" cy="7"   r="1.05" fill="#ca8a04"/>
  <circle cx="9"  cy="9.5" r="1.05" fill="#ca8a04"/>
  <circle cx="11" cy="9.5" r="1.05" fill="#ca8a04"/>
  <circle cx="9"  cy="12"  r="1.05" fill="#ca8a04"/>
  <circle cx="11" cy="12"  r="1.05" fill="#ca8a04"/>
  <!-- husk leaves -->
  <path d="M7 10 Q3 12 5 16 Q7.5 13 8 13" fill="#16a34a"/>
  <path d="M13 10 Q17 12 15 16 Q12.5 13 12 13" fill="#16a34a"/>
  <!-- silk strands at top -->
  <line x1="9.5"  y1="5" x2="8"  y2="2" stroke="#ca8a04" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="10"   y1="5" x2="10" y2="2" stroke="#ca8a04" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="10.5" y1="5" x2="12" y2="2" stroke="#ca8a04" stroke-width="0.9" stroke-linecap="round"/>
</svg>

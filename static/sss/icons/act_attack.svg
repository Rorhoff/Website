<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- blade body -->
  <line x1="3" y1="3" x2="16" y2="16" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round"/>
  <!-- blade edge highlight -->
  <line x1="3" y1="3" x2="11.5" y2="11.5" stroke="#f1f5f9" stroke-width=".9" stroke-linecap="round"/>
  <!-- crossguard -->
  <line x1="7.5" y1="12.5" x2="12.5" y2="7.5" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- grip -->
  <line x1="14" y1="14" x2="17.5" y2="17.5" stroke="#78350f" stroke-width="2.8" stroke-linecap="round"/>
  <!-- pommel -->
  <circle cx="18" cy="18" r="1.8" fill="#92400e"/>
  <!-- glowing tip -->
  <circle cx="3" cy="3" r="2.2" fill="#ef4444" opacity=".45"/>
  <circle cx="3" cy="3" r="1"   fill="#fbbf24"/>
</svg>

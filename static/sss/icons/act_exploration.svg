<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- tripod legs -->
  <line x1="10" y1="13" x2="5.5"  y2="19.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="13" x2="10"   y2="19.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="13" x2="14.5" y2="19.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- scope tube -->
  <rect x="3" y="7.5" width="14" height="4.5" rx="2.2" fill="#475569" transform="rotate(-25 10 9.75)"/>
  <!-- eyepiece (narrow end) -->
  <rect x="10.5" y="8" width="5.5" height="3.5" rx="1.8" fill="#64748b" transform="rotate(-25 10 9.75)"/>
  <!-- objective lens glow (wide end) -->
  <circle cx="4.2" cy="13" r="2.5" fill="none" stroke="#38bdf8" stroke-width="1.4"/>
  <circle cx="4.2" cy="13" r="1"   fill="#38bdf8" opacity=".4"/>
  <!-- stars -->
  <circle cx="2"  cy="4"   r="1.2" fill="#fde68a"/>
  <circle cx="7"  cy="1.5" r=".8"  fill="#fde68a"/>
  <circle cx="12" cy="3"   r="1"   fill="#fde68a"/>
  <circle cx="1"  cy="8"   r=".5"  fill="#cbd5e1"/>
</svg>

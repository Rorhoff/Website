<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- nail head (flat wide cap) -->
  <rect x="5" y="3" width="10" height="2.5" rx="1.2" fill="#cbd5e1"/>
  <rect x="5" y="3" width="10" height="1.2" rx="1.2" fill="#e2e8f0"/>
  <!-- shaft -->
  <rect x="9" y="5.5" width="2" height="9" fill="#94a3b8"/>
  <!-- shaft highlight -->

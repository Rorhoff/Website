<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- coin edge/shadow -->
  <circle cx="10.4" cy="10.4" r="8" fill="#b45309"/>
  <!-- coin face -->
  <circle cx="10" cy="10" r="8" fill="#fbbf24"/>
  <!-- inner rim highlight -->
  <circle cx="10" cy="10" r="7.2" fill="none" stroke="#fde68a" stroke-width="0.8"/>
  <!-- inner detail ring -->
  <circle cx="10" cy="10" r="5.2" fill="none" stroke="#d97706" stroke-width="0.9"/>
  <!-- vertical bar of $ -->
  <line x1="10" y1="6.2" x2="10" y2="13.8" stroke="#92400e" stroke-width="1.3" stroke-linecap="round"/>
  <!-- top arc of $ -->
  <path d="M8 8 Q8 6.5 10 6.5 Q12 6.5 12 8.2 Q12 10 10 10" fill="none" stroke="#92400e" stroke-width="1.1" stroke-linecap="round"/>
  <!-- bottom arc of $ -->
  <path d="M12 12 Q12 13.5 10 13.5 Q8 13.5 8 11.8 Q8 10 10 10" fill="none" stroke="#92400e" stroke-width="1.1" stroke-linecap="round"/>
</svg>

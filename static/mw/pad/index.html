<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14100d">
<meta name="mobile-web-app-capable" content="yes">
<title>MotherWyrm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="join" class="screen">
  <div class="join-card">
    <p class="spore-mark" aria-hidden="true"></p>
    <h1>MotherWyrm</h1>
    <p class="join-lede">Enter the code showing on the TV.</p>

    <label for="code">Game code</label>
    <input id="code" inputmode="text" autocomplete="off" autocapitalize="characters"
           spellcheck="false" maxlength="4" placeholder="ABCD">

    <label for="name">Your name</label>
    <input id="name" autocomplete="off" maxlength="12" placeholder="Rory">

    <button id="joinBtn" class="primary">Join the game</button>
    <p id="joinError" class="error" role="status"></p>
  </div>
</main>

<main id="pad" class="screen hidden">
  <header class="pad-head">
    <span id="padName"></span>
    <span id="padRole"></span>
  </header>

  <div class="pad-body">
    <div id="stick" class="stick">
      <div id="knob" class="knob"></div>
    </div>

    <div class="buttons">
      <button id="btnAction" class="pad-btn action">Action</button>
      <button id="btnJump" class="pad-btn jump">Jump</button>
    </div>
  </div>

  <p id="padCue" class="cue" role="status"></p>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
